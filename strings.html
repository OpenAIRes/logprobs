<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logprobs — strings</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app.css">
<!-- In <head> and blocking: resolving the palette after the body renders
     shows the wrong one for a frame, and the bar navigates on every change. -->
<script src="/theme.js"></script>
<style>
  /* Palette, buttons and form controls live in app.css so every page reads as
     one program. Only this page's own layout stays here. */

  header { margin-bottom: 1.5rem; }
  h1 { margin: 0 0 .35rem; font-size: 1.5rem; letter-spacing: -.01em; font-weight: 620; }
  .sub { color: var(--ink-dim); font-size: .875rem; }

  .meta {
    display: flex; flex-wrap: wrap; gap: .4rem 1.5rem;
    margin-top: 1rem; padding: .7rem .9rem;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow);
    font-size: .8125rem;
  }
  .meta div { color: var(--ink-dim); }
  .meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0 .6rem; flex-wrap: wrap; }
  .shown { font-size: .78125rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .shown.filtered { color: var(--accent); font-weight: 600; }

  /* --- compact one-line-per-entry table --- */
  .table {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 9px; box-shadow: var(--shadow); overflow: hidden;
  }
  /* Full text per row. The string column stops being 1fr -- which is what forced
     the ellipsis -- and takes the width it needs, so the table scrolls sideways
     rather than cutting every row off at the same place. */
  body.wide-rows .table { overflow-x: auto; }
  /* --textw is measured once per render and shared by every row. Each .row is
     its own grid, so `max-content` sized each one independently and the numeric
     columns landed in a different place on every line. One width, set from the
     widest string, puts them under each other. */
  body.wide-rows .thead, body.wide-rows .row {
    grid-template-columns: 3rem var(--textw, max-content) 3.5rem 6rem 6rem 5.5rem 7rem;
    width: max-content; min-width: 100%;
  }
  body.wide-rows .has-end .thead, body.wide-rows .has-end .row,
  body.wide-rows .has-end .tfilter {
    grid-template-columns: 3rem var(--textw, max-content) 3.5rem 6rem 6rem 5.5rem 7rem 4.5rem;
  }
  body.wide-rows .has-change .thead, body.wide-rows .has-change .row,
  body.wide-rows .has-change .tfilter {
    grid-template-columns: 3rem var(--textw, max-content) 3.5rem 6rem 6rem 5.5rem 7rem 13rem 4.5rem;
  }
  body.wide-rows .has-change.has-end .thead, body.wide-rows .has-change.has-end .row,
  body.wide-rows .has-change.has-end .tfilter {
    grid-template-columns: 3rem var(--textw, max-content) 3.5rem 6rem 6rem 5.5rem 7rem 13rem 4.5rem 4.5rem;
  }
  body.wide-rows .text { overflow: visible; text-overflow: clip; }
  .capnote { color: var(--ink-faint); font-size: .71875rem; padding-left: .3rem; }
  .emptywhy { padding: 0 .9rem .3rem; font-size: .8125rem; color: var(--ink-dim); }
  .emptywhy b { color: var(--ink); font-weight: 600; }
  #emptyClear { margin: 0 .9rem 1rem; }
  .thead, .row {
    display: grid;
    grid-template-columns: 3rem minmax(0,1fr) 3.5rem 6rem 6rem 5.5rem 7rem;
    gap: .85rem; align-items: center;
    padding: .3rem .9rem;
  }
  /* The tail columns, and only the ones the rows on screen carry. A deviation
     row says what was changed and what that change cost; a completion says only
     how it ended. These used to be one cell headed "end · deviation", which put
     the cost -- the number the deviations view is ordered by -- inside a line of
     prose where it could be neither read down nor compared. */
  .has-end .thead, .has-end .row, .has-end .tfilter {
    grid-template-columns: 3rem minmax(0,1fr) 3.5rem 6rem 6rem 5.5rem 7rem 4.5rem;
  }
  .has-change .thead, .has-change .row, .has-change .tfilter {
    grid-template-columns: 3rem minmax(0,1fr) 3.5rem 6rem 6rem 5.5rem 7rem 13rem 4.5rem;
  }
  .has-change.has-end .thead, .has-change.has-end .row, .has-change.has-end .tfilter {
    grid-template-columns: 3rem minmax(0,1fr) 3.5rem 6rem 6rem 5.5rem 7rem 13rem 4.5rem 4.5rem;
  }
  /* The one column that is written rather than read. It looks like the rest of
     the row until you put the pointer on it, because a grid full of boxes reads
     as a form and this is a table. */
  .c-group input { width: 100%; min-width: 0; font: inherit; font-size: .71875rem;
    color: var(--ink); background: transparent; border: 1px solid transparent;
    border-radius: 4px; padding: .1rem .25rem; }
  .c-group input::placeholder { color: var(--ink-faint); }
  .c-group input:hover:not(:disabled) { border-color: var(--line); }
  .c-group input:focus { border-color: var(--accent); background: var(--panel);
    outline: none; }
  .c-group input:disabled { color: var(--ink-faint); cursor: not-allowed; }
  .c-group input.saving { border-color: var(--mid); }
  .c-group input.failed { border-color: var(--bad); }
  /* The filter row: the same grid as the header, so a control sits under the
     column it acts on. Out of the way until asked for -- the table is for
     reading and this is for narrowing it. */
  .tfilter { display: grid; gap: .85rem; align-items: center; padding: .25rem .9rem .35rem;
    background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 2.1rem; z-index: 4; }
  .tfilter[hidden] { display: none !important; }
  .tfilter input, .tfilter select { width: 100%; min-width: 0; font: inherit;
    font-size: .6875rem; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: .08rem .2rem; }
  .tfilter input::placeholder { color: var(--ink-faint); }
  .tfilter .on { border-color: var(--accent); }
  button.tfbtn { border: 0; background: transparent; color: var(--ink-faint);
    padding: 0 .15rem; font-size: .8125rem; line-height: 1; cursor: pointer; }
  button.tfbtn:hover, button.tfbtn.on { background: transparent; color: var(--accent); }
  .c-change, .c-cost, .c-end { font-size: .71875rem; color: var(--ink-faint);
    font-family: ui-monospace, Menlo, monospace; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  /* Full ink, not the faint grey the rest of this tail uses: in the deviations
     view the change IS the row's subject, and a greyed-out subject reads as an
     aside. The two tokens are chips with room around the arrow, so a leading
     space shows as the chip's own edge rather than needing a marker. */
  .row .c-change { color: var(--ink); }
  .c-change .chip { background: var(--chip); border-radius: 3px; padding: 0 .22em; }
  .c-change .arrow { padding: 0 .4em; color: var(--ink-dim); }
  .c-change .pos { color: var(--accent); font-weight: 600; }
  .c-change .onpath { color: var(--good); }
  .c-change .ncalls { color: var(--mid); }   /* same string from several calls */
  .c-cost { color: var(--mid); }
  /* What decided the end of this string. Without it a prefix and a finished
     string look alike in the table, and their Σ logprob is not the same kind of
     quantity -- a prefix's can only get worse. */
  .c-end .end { font-weight: 600; }
  .c-end .end.stop { color: var(--good); }
  .c-end .end.length { color: var(--mid); }
  .c-end .end.open { color: var(--ink-faint); font-weight: 400; }
  .c-end .cont { color: var(--accent); padding-left: .15rem; }
  /* The continuation is shown but is NOT what the row was ranked by, so it reads
     as a different kind of text rather than more of the same. */
  .tok.ext { opacity: .62; }
  .extmark { color: var(--accent); font-weight: 600; padding: 0 .1rem; }
  .more { color: var(--ink-faint); font-size: .71875rem; }
  .subnum { display: block; font-size: .6875rem; color: var(--ink-faint);
    font-family: ui-monospace, Menlo, monospace; }
  .dup { color: var(--ink-faint); font-size: .71875rem; }
  .warn { color: var(--bad); }
  .thead {
    position: sticky; top: 0; z-index: 5;
    background: var(--card); border-bottom: 1px solid var(--line);
    font-size: .6875rem; text-transform: uppercase; letter-spacing: .045em;
    color: var(--ink-faint); font-weight: 600; padding-top: .5rem; padding-bottom: .5rem;
  }
  .thead .num, .row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .thead .key { color: var(--accent); }
  /* Clicking a column reorders what is on screen. Not a request: the bar's
     criterion decides WHICH strings these are -- a top 200 by Σ is a different
     set from a top 200 by cost -- and this decides the order you read them in. */
  .thead > [data-sort] { cursor: pointer; user-select: none; }
  .thead > [data-sort]:hover { color: var(--ink-dim); }
  .thead > [data-sort]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .thead > [data-sort].sorted { color: var(--accent); }
  .thead .sortmark { padding-left: .3em; }

  .row { border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--hover); }
  .row.open { background: var(--hover); }

  .rank { font: 600 .8125rem/1 ui-monospace, Menlo, monospace; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; }
  button.branch-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1rem; height: 1rem; min-width: 0; min-height: 0;
    padding: 0; margin: .2rem 0 0; border: 0; border-radius: 0;
    background: transparent; box-shadow: none;
    color: var(--ink-dim); font: 1rem/1 sans-serif;
  }
  button.branch-icon:hover:not(:disabled), button.branch-icon:active:not(:disabled) {
    background: transparent; border: 0; color: var(--accent);
  }
  button.branch-icon:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .row.open .rank { color: var(--accent); }

  /* Proportional, not monospace. A column of monospace strings reads as code
     and these are sentences; the deviations table had it this way and was easier
     on the eye for it. Token boundaries are still visible -- that is what the
     colour and the ␣ markers are for, and neither needs a fixed pitch. */
  .text {
    font: 13px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .row.open .text { white-space: normal; overflow: visible; word-break: break-word; padding: .25rem 0; }
  /* The string opens on its own page, so it reads as a link on hover -- dotted
     and only while the pointer is on it, not the permanent underline the prompt
     span used to carry. */
  .row:not(.open) .text:hover { text-decoration: underline dotted;
    text-decoration-color: var(--ink-faint); text-underline-offset: 3px; }

  .tok {
    display: inline-block; padding: .02em .24em; margin: 0 1px 1px 0;
    border-radius: 3px; border-bottom: 2px solid transparent;
  }
  /* Reading mode: the chip padding and margin put a visible gap between every
     token, so "Porchlight" read as "Por ch light" -- the separators were being
     read as spaces. Gone here; a token boundary is a change of shade instead,
     which is what the colour is for. */
  body.wide-rows .tok {
    padding: .02em 0; margin: 0; border-radius: 0;
  }
  .row.open .tok { cursor: pointer; }
  .row.open .tok:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
  .tok.sel { background: var(--accent) !important; color: var(--card); }
  .tok .ctrl { color: var(--ink-faint); font-size: .85em; }
  .tok.sel .ctrl { color: var(--card); opacity: .75; }
  .tok.alt { border-bottom-color: var(--mid); border-bottom-style: dotted; }

  .cell { font-size: .78125rem; color: var(--ink-dim); font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Menlo, monospace; }
  .cell.key { color: var(--accent); font-weight: 600; }

  .detail {
    grid-column: 1 / -1;
    margin: .1rem 0 .5rem; padding: .65rem .8rem;
    background: var(--chip); border-radius: 7px; font-size: .8125rem;
    cursor: default;
  }
  .detail.hide { display: none; }
  .detail .dh { font-weight: 600; margin-bottom: .4rem; font-family: ui-monospace, Menlo, monospace; }
  .detail .dh .src { font-family: system-ui, sans-serif; font-weight: 500; font-size: .8125rem;
    color: var(--ink-dim); margin-left: .5rem; }
  .detail table { border-collapse: collapse; max-width: 420px; }
  .detail td { padding: .1rem .6rem .1rem 0; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Menlo, monospace; font-size: .78125rem; }
  .detail td.num { color: var(--ink-dim); text-align: right; }
  .detail tr.this td { color: var(--accent); font-weight: 600; }
  .detail .none, .detail .hint { color: var(--ink-faint); font-style: italic; }

  #err { color: var(--bad); padding: 1rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; }

  /* --- alternatives grid and walk --- */
  #special { background: var(--card); border: 1px solid var(--line);
    border-radius: 9px; box-shadow: var(--shadow); overflow: hidden; }
  .prow { display: grid; grid-template-columns: 2.5rem 7rem minmax(0,1fr);
    gap: .7rem; align-items: baseline; padding: .35rem .9rem;
    border-bottom: 1px solid var(--line-soft); }
  .prow:last-child { border-bottom: none; }
  .prow .pi { font: 600 .75rem/1.6 ui-monospace, Menlo, monospace; color: var(--ink-faint); }
  .prow .base { font: 13px/1.6 ui-monospace, Menlo, monospace; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alts { display: flex; flex-wrap: wrap; gap: .25rem; min-width: 0; }
  .alt-chip { font: 12px/1.5 ui-monospace, Menlo, monospace; padding: .05em .35em;
    border-radius: 3px; background: var(--chip); border: 1px solid transparent;
    cursor: default; white-space: nowrap; }
  /* The greedy alternative is the token the model actually chose. It has to be
     distinguishable from the other 19, or the grid does not say what the
     deviations deviate from. */
  .alt-chip.greedy { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .alt-chip .lp { color: var(--ink-faint); margin-left: .3em; }

  .wrow { display: grid; grid-template-columns: 2.5rem 3rem 9rem 5rem 3.5rem 6rem;
    gap: .7rem; align-items: baseline; padding: .35rem .9rem .1rem;
    font-size: .78125rem; color: var(--ink-dim);
    font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .wtext { padding: 0 .9rem .4rem 5.9rem; border-bottom: 1px solid var(--line-soft);
    font: 13px/1.6 ui-monospace, Menlo, monospace; color: var(--ink);
    white-space: pre-wrap; word-break: break-word; }
  .wrow .cost { color: var(--accent); font-weight: 600; }
  .needs { padding: .6rem .9rem; background: rgba(176,125,43,.10); color: var(--mid);
    font-size: .78125rem; line-height: 1.5; }
  .needs b { font-family: ui-monospace, Menlo, monospace; }

  /* The deviations view works from one string, so what it works from, what the
     set covers and the one button that spends money sit above the table. Carried
     over from the page this used to be; the table, the bar and the colour key
     are what it gains by no longer being a page. */
  /* The same rule the header follows in app.css, for the same reason: what the
     set covers and what it came from explains the table rather than being it.
     With details off the rows start under the bar. The Fetch button rides along,
     because it is one of the things that are there now. */
  body:not(.show-meta) #planwrap { display: none !important; }
  #planwrap { margin: .2rem 0 1rem; }
  #planwrap .why { color: var(--ink-dim); font-size: .8125rem; line-height: 1.5;
    max-width: 62rem; margin: .4rem 0; }
  .base { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: .7rem .9rem; margin: .5rem 0; white-space: pre-wrap;
    overflow-wrap: anywhere; font-size: .8125rem; max-height: 11rem; overflow: auto; }
  .plan { display: flex; flex-wrap: wrap; gap: .3rem .9rem; align-items: baseline;
    margin: .6rem 0; font-size: .8125rem; }
  .plan b { font-variant-numeric: tabular-nums; }
  .plan .paid { color: var(--bad); }
  .plan .capped { color: var(--mid); }
  .planrow { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .6rem 0; }
  #planstatus { font-size: .8125rem; color: var(--ink-dim); min-height: 1.2rem; margin: .3rem 0; }
  /* What the call that was just paid for actually said. The rows are rebuilt from
     a fresh plan, so without this you approve a call, get asked about the next
     one, and never see the answer to the first. */
  #last { padding: .5rem .7rem; background: var(--chip); border: 1px solid var(--line);
    border-radius: 8px; font-size: .8125rem; white-space: pre-wrap;
    overflow-wrap: anywhere; max-height: 9rem; overflow: auto; }
  #last b { color: var(--ink-dim); font-weight: 600; }

  @media (max-width: 720px) {
    /* Every tail variant has to be named here. A bare `.thead` loses to
       `.has-change .thead` on specificity whatever the order, which is why the
       wide grid used to survive on a phone and push the string column to nothing. */
    .thead, .row,
    .has-end .thead, .has-end .row,
    .has-change .thead, .has-change .row,
    .has-change.has-end .thead, .has-change.has-end .row {
      grid-template-columns: 2.5rem minmax(0,1fr) 5.5rem;
    }
    .thead .c-mean, .row .c-mean, .thead .c-ppl, .row .c-ppl,
    .thead .c-n, .row .c-n,
    .thead .c-change, .row .c-change, .thead .c-cost, .row .c-cost,
    .thead .c-group, .row .c-group,
    .thead .c-end, .row .c-end { display: none; }
  }
</style>
</head>
<body>
<!-- One settings bar for every page, rendered by bar.js. This page's own strip
     below keeps only what is a live filter over already-loaded rows. -->
<div id="settingsbar"></div>
<!-- Before this page's own script, not after: the page reads its settings from
     window.settingsBar, and a `const` in bar.js is not visible until it runs. -->
<!-- ask-policy first: bar.js builds its settings row from it, and
     greedy-branches asks it for the per-model call size. -->
<script src="/ask-policy.js"></script>
<script src="/call-report.js"></script>
<script src="/approve-request.js"></script>
<script src="/bar.js"></script>
<script src="/greedy-branches.js"></script>

<div class="wrap">
  <header>
    <h1 id="title">Logprobs</h1>
    <div class="sub">
      <span id="blurb"></span>
      Data: <code id="srcName">/api/query</code>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  </div>
  </div>

  <section id="planwrap" hidden>
    <div id="promptWrap" hidden>
      <p class="why"><b>Fixed prompt</b> — no logprobs were returned for it, so it has no
        alternatives and is never deviated. It stays in front of every call, and the strings
        in the table are the generated part only.</p>
      <div class="base" id="prompt"></div>
    </div>
    <div class="base" id="base"></div>
    <div class="plan" id="plan"></div>
    <div class="planrow">
      <button type="button" id="fetch" class="danger" hidden></button>
      <button type="button" id="json" disabled>Download JSON</button>
      <button type="button" id="txt" disabled>Download text</button>
    </div>
    <p id="planstatus" role="status"></p>
    <div id="last" hidden></div>
  </section>

  <div class="table" id="table" hidden>
    <div class="thead">
      <div tabindex="0" data-sort="rank" title="The order the store ranked these in. Click to go back to it.">#<button type="button" class="tfbtn" id="tfToggle" title="Filtrovat sloupce">⌕</button></div>
      <div tabindex="0" data-sort="text" title="Sort the rows on screen alphabetically.">string</div>
      <div tabindex="0" data-sort="n" class="num c-n" title="Sort by how many tokens the string has.">length</div>
      <div tabindex="0" data-sort="sum_logprob" class="num key" title="Sort by the summed logprob.">Σ logprob</div>
      <div tabindex="0" data-sort="mean_logprob" class="num c-mean" title="Sort by logprob per token.">mean</div>
      <div tabindex="0" data-sort="perplexity" class="num c-ppl" title="Sort by perplexity, lowest first.">ppl</div>
      <div tabindex="0" data-sort="group" class="c-group" title="Your own label for this string — type in the cell to set it, empty to clear. Click here to sort by it. Saved against the record, so it is the same label in every view.">group</div>
      <div tabindex="0" data-sort="change" class="c-change" id="thChange" hidden title="Sort by the position the string departed at.">change</div>
      <div tabindex="0" data-sort="cost" class="num c-cost" id="thCost" hidden title="Sort by what the departure cost, cheapest first.">cost</div>
      <div tabindex="0" data-sort="end" class="c-end" id="thEnd" hidden title="Sort by how the string ended.">end</div>
    </div>
    <div class="tfilter" id="tfilter" hidden></div>
    <div id="list"></div>
  </div>
  <!-- The grid and the walk have a different shape from a ranking, so they carry
       their own container instead of being forced into the six-column grid. -->
  <div id="special" hidden></div>

  <div id="err" style="display:none"></div>
</div>

<script>
const listEl  = document.getElementById('list');
const tableEl = document.getElementById('table');
const metaEl  = document.getElementById('meta');
const errEl   = document.getElementById('err');
/* The settings all live in the bar, which persists them and puts them in the
   address. This page reads them and renders; it owns no control of its own, so
   there is nothing left that can disagree with what the bar says. */
const BAR = window.settingsBar || { state: {} };
/* The row the reader has expanded, which is what `json` in the bar reports on.
   A list has no single record until one is opened. */
let openRowId = null;
if (BAR.provideRecord) BAR.provideRecord(() => openRowId);
const S = BAR.state;
const listOf = v => (v ? String(v).split(',') : []);
/* The bar's answer, not a second one. Which criterion is in force depends on
   which views have something to depart from, and that list grew -- having it
   written out here too is how the two would come to disagree. */
const effectiveSort = BAR.effectiveSort;



/* Filtr "zacina na": porovnava se surovy text vcetne bilych znaku, ne to, co
   je videt v tabulce (tam se \n zobrazuje jako ⏎). Vetsina retezcu zacina
   newline, takze hledani "I have" by pri striktnim prefixu nenaslo nic —
   pocatecni bile znaky se proto pri porovnani ignoruji. */
function matchesPrefix(text, q) {
  if (!q) return true;
  return text.startsWith(q) || text.replace(/^\s+/, '').startsWith(q);
}

function currentPrefix() { return S.prefix || ''; }
/* The count lives in the bar, which is the only counter now: this page's own
   strip said "200 of 363 results · 451 unreachable · 8492 records in store",
   all of which the meta block below already states, and the first half of which
   the bar states too. */
const shownEl = document.getElementById('sInfo') || document.createElement('span');
// This page reports its own count into the bar's slot, so the bar stops writing
// there -- otherwise both would, and whichever fetch landed last would win.
if (window.settingsBar && window.settingsBar.suppressInfo) window.settingsBar.suppressInfo();


let DB = null;

// Render control characters visibly — otherwise a token that is purely "\n" or
// " " renders as nothing at all and the row looks empty.
function escapeToken(t) {
  const out = [];
  for (const ch of t) {
    if (ch === '\n') out.push('<span class="ctrl">⏎</span>');
    else if (ch === '\t') out.push('<span class="ctrl">⇥</span>');
    else if (ch === ' ') out.push('<span class="ctrl">␣</span>');
    else if (ch === '\ufeff') out.push('<span class="ctrl">[BOM]</span>');
    else out.push(ch.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
  }
  return out.join('');
}
function plain(t) {
  return t.replace(/\n/g,'\\n').replace(/\t/g,'\\t').replace(/ /g,'␣').replace(/\ufeff/g,'[BOM]');
}

// Colour a token by its probability: near-1 reads as "confident", near-0 as
// "the model was genuinely choosing". Alpha-only so it works in both themes.
// Shared with the token browser, from bar.js: the same token used to be plain
// there and coloured here.
const tokColor = window.tokColor;

/* What a person has written against each record, by id. Fetched once and kept
   here rather than carried on every entry: a ranking answers with 200 rows and
   the same record can be in several of them, and the entry shapes come from four
   different endpoints that would each have to learn about it.

   `group` is one key inside `metadata`, which is OpenAI's name for user-defined
   key/value tagging. Nothing here is ever sent to the API -- the endpoint this
   project calls has no such field -- but the shape is theirs, so a second
   dimension later is another key rather than another column of bookkeeping. */
let annotations = {};
/* Which metadata keys get a column of their own. One list, so a third key is a
   word here rather than a column of bookkeeping spread over the file.
   Today it holds how many rewritings the instruction asks for -- "a different
   version" is 1, "different versions" is >1 -- which is a property of the string
   rather than of the call, so it lives with the labels and not in the record.
   That is a use of the column, not its definition: it takes whatever you type. */
const META_COLUMNS = [
  {key: 'group', cls: 'c-group', width: '7rem'},
];
const metaOf = (e, key) => ((annotations[e && e.id] || {})[key]) || '';
const groupOf = e => metaOf(e, 'group');

async function loadAnnotations() {
  try {
    const r = await fetch('/api/annotations', {cache: 'no-store'});
    if (r.ok) annotations = (await r.json()).annotations || {};
  } catch { /* the labels are an overlay; the table is worth showing without them */ }
}

/* Saved as you leave the cell, not as you type: one call per label rather than
   one per keystroke. The cell says which of the three it is -- being saved,
   saved, or refused -- because a label that silently failed to stick is worse
   than no label. */
async function saveGroup(input) {
  const id = input.dataset.id;
  const key = input.dataset.key || 'group';
  const value = input.value.trim();
  if (!id || value === (input.dataset.saved || '')) return;
  input.classList.remove('failed');
  input.classList.add('saving');
  try {
    const r = await fetch('/api/annotate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id, key, value}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    annotations[id] = data.metadata || {};
    input.dataset.saved = value;
    input.classList.remove('saving');
  } catch (err) {
    input.classList.remove('saving');
    input.classList.add('failed');
    input.title = 'Nepodařilo se uložit: ' + err.message;
  }
}

const viewerUrl = id => '/logprobs.html?id=' + encodeURIComponent(id);

/* The string on its own, in a new tab -- the list is what you came back to, and
   a ranking of three hundred rows is a place you keep your finger in while you
   read one of them.

   A row that is a recorded call names it. A prefix does not: it is a path in the
   token trie, assembled from whatever records pass through it, and no single
   call is "that string". The nearest real thing is a recorded call that begins
   with it, which the completions view can already find by prefix -- so that is
   what opens, and it is a longer string than the row, deliberately.

   The tab is opened on the click and navigated afterwards. A window.open that
   happens after an await has lost the click that authorised it, and the browser
   blocks it as a popup. `noopener` is left off for that one, because with it the
   call returns null and there is nothing to navigate; the page it loads is our
   own. */
async function openInViewer(e) {
  if (e.id) { window.open(viewerUrl(e.id), '_blank', 'noopener'); return; }
  const tab = window.open('', '_blank');
  try {
    const p = new URLSearchParams({ view: 'completions', top: '1', prefix: e.text });
    if (S.model) p.set('model', S.model);
    if (S.sources) p.set('sources', S.sources);
    const db = await (await fetch('/api/query?' + p, { cache: 'no-store' })).json();
    const id = ((db.entries || [])[0] || {}).id;
    if (id) { if (tab) tab.location = viewerUrl(id); return; }
  } catch { /* say so below rather than leaving a blank tab open */ }
  if (tab) tab.close();
  showError('a recorded call beginning with this prefix',
            new Error('the store has none'),
            'a prefix is a path in the token trie, not a call of its own');
}

/* Number(null) is 0, so a missing perplexity used to print as 0.00 -- the most
   confident possible reading of a value that does not exist. */
function fmt(x, d = 4) {
  return (x === null || x === undefined || !isFinite(x)) ? '—' : Number(x).toFixed(d);
}

/* The alternative's text goes into title="", so quotes and ampersands suffice;
   plain() has already made whitespace visible, so no raw newline gets here. */
function escapeAttr(t) {
  return plain(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// Named (rather than inline in the click handler) so the detail rendering can be
// exercised directly, without a real mouse event.
function toggleTokenDetail(row, entry, index) {
  const detailEl = row.querySelector('.detail');
  const el = row.querySelector(`.tok[data-i="${index}"]`);
  const t = entry.tokens[index];
  if (!el || !t) return;

  const wasSel = el.classList.contains('sel');
  row.querySelectorAll('.tok.sel').forEach(s => s.classList.remove('sel'));
  if (wasSel) { renderRowHint(detailEl); return; }
  el.classList.add('sel');

  const alts = t.alternatives || [];
  const rows = alts.length
    ? `<table>${alts.map(a => `
        <tr class="${a.token === t.token ? 'this' : ''}">
          <td>${plain(a.token)}</td>
          <td class="num">${fmt(a.logprob, 3)}</td>
          <td class="num">${fmt(Math.exp(a.logprob), 5)}</td>
        </tr>`).join('')}</table>`
    : `<div class="none">No alternatives recorded at this position.</div>`;

  detailEl.innerHTML = `
    <div class="dh">„${plain(t.token)}"
      <span class="src">logP ${fmt(t.logprob)} · p ${fmt(Math.exp(t.logprob), 5)}
      · cumulative ${fmt(t.cumulative)} · from ${t.source === 'alt' ? 'top_logprobs (alternative)' : 'a generated token'}</span>
    </div>${rows}`;
  detailEl.classList.remove('hide');
}

function renderRowHint(detailEl) {
  detailEl.innerHTML = `<div class="hint">Click a token above to see its logprob and the alternatives the model weighed at that position.</div>`;
  detailEl.classList.remove('hide');
}

/* The provenance column. A sweep entry says which alternative it took; a greedy
   sibling says the same thing plus what the departure cost, which is the number
   the whole view is ordered by, so it has to be on the row. */
/* What ended this string, shown on every row. It is not decoration: Σ logprob
   over an 'open' prefix is a partial sum that can only get worse, over a 'stop'
   string it is final, so two rows are only comparable when this matches. */
const END_TITLE = {
  stop: 'finished — the model emitted EOS, so Σ logprob is final. '
      + 'The only ending that is not a prefix.',
  length: 'a prefix — max_tokens ran out; the model had not finished. Σ is a partial sum.',
  open: 'a prefix — nothing recorded ends here; the trie continues below and the '
      + 'enumeration stopped.',
};
/* A row that the database continues past. Not the same as how it ended: 494
   length-ended paths were later taken as another call's prompt and carried on. */
function contMark(e) {
  if (e.node_kind !== 'continues') return '';
  return '<span class="cont" title="the database holds a continuation of this string — '
    + 'tick only “dead end” to exclude rows like this">⋯</span>';
}

function endBadge(e) {
  // With the row extended, the ending shown is the extension's -- an 'open'
  // prefix that was followed to a record end is no longer open.
  const end = (e.extension && e.extension.added_n ? e.extension.end : null)
    || e.end || e.finish_reason;
  if (!end) return '';
  return `<span class="end ${end}" title="${END_TITLE[end] || ''}">${end}</span>`;
}

/* A token as it reads in a cell: a chip, so a leading or trailing space is the
   chip's own edge instead of needing a ␣ marker, and escaped, because a token is
   arbitrary text from the model and `<` is a token the model emits. */
function chip(t) {
  return `<span class="chip">${String(t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\n/g, '\\n').replace(/\t/g, '\\t').replace(/\ufeff/g, '[BOM]')}</span>`;
}

/* What the row departed from. A sweep entry says which alternative it took; a
   deviation says the position and the swap. */
function changeCell(e) {
  if (e.deviation !== undefined) {
    if (!e.deviation) return '<span class="onpath">greedy</span>';
    const d = e.deviation;
    return (d.parent_rank ? `from #${d.parent_rank} · ` : '')
      + `<span class="pos">${d.position}</span> `
      + `${chip(d.original)}<span class="arrow">→</span>${chip(d.alternative)}`;
  }
  if (e.sweep) {
    // The finish_reason used to be repeated here; the end column says it now.
    return (e.sweep.is_greedy
      ? '<span class="onpath">on-path</span>'
      : `<span class="pos">${e.sweep.position}</span> ${chip(e.sweep.alternative)}`)
      + (e.n_calls > 1 ? ` <span class="ncalls">×${e.n_calls}</span>` : '');
  }
  return '';
}

/* What that change cost, in nats. Its own column because it is a number you read
   down a list, and in the deviations view it is what the list is ordered by. */
function costCell(e) {
  return (e.cost === undefined || e.cost === null) ? '' : fmt(e.cost, 3);
}

function endCell(e) { return endBadge(e) + contMark(e); }

/* A prefix has no record to hang a label on -- it is a path in the trie, not a
   call -- so its cell says so instead of taking text that could not be kept. */
function metaCells(e) {
  return META_COLUMNS.map(col => {
    const value = escapeAttr2(metaOf(e, col.key));
    return e.id
      ? `<div class="${col.cls}"><input type="text" value="${value}" data-id="${escapeAttr2(e.id)}"
           data-key="${col.key}" data-saved="${value}" placeholder="—" aria-label="${col.key}"
           maxlength="512" spellcheck="false"></div>`
      : `<div class="${col.cls}"><input type="text" placeholder="—" disabled
           title="Prefix — cesta v trii, ne volání, takže na něm není co označit."></div>`;
  }).join('');
}

/* plain() makes whitespace visible, which is right in a title and wrong in a
   value the user typed. */
function escapeAttr2(t) {
  return String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                  .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Clicking a column header reorders the rows on screen, and only that. It does
   NOT change what the bar asks the store for: the bar's criterion decides WHICH
   strings you are looking at -- a top 200 by Σ is a different set of strings from
   a top 200 by cost -- and this decides the order you read them in. The # column
   keeps the store's rank, so a local sort shows visibly out-of-order numbers,
   which is the plainest way of saying you are no longer reading the ranking.

   `first` is the direction a first click gives: whichever end of the column is
   the interesting one. Best-first for the sums, cheapest-first for cost and
   perplexity, A-to-Z for the text. */
const SORTABLE = {
  rank:         {get: e => e.rank, first: 'asc'},
  text:         {get: e => e.text || '', first: 'asc', text: true},
  n:            {get: e => e.n, first: 'desc'},
  sum_logprob:  {get: e => e.sum_logprob, first: 'desc'},
  mean_logprob: {get: e => e.mean_logprob, first: 'desc'},
  perplexity:   {get: e => e.perplexity, first: 'asc'},
  cost:         {get: e => e.cost, first: 'asc'},
  change:       {get: e => (e.deviation ? e.deviation.position
                          : e.sweep ? e.sweep.position : null), first: 'asc'},
  end:          {get: e => e.end || e.finish_reason || '', first: 'asc', text: true},
  // Unlabelled rows sort last either way -- see the missing-value rule below --
  // so turning the column round groups the labels, it does not bury them.
  group:        {get: e => groupOf(e) || null, first: 'asc', text: true},
};
let localSort = null;      // {key, dir}, or null for the order the store sent

function sortEntries(list) {
  const spec = localSort && SORTABLE[localSort.key];
  if (!spec) return list;
  const sign = localSort.dir === 'asc' ? 1 : -1;
  const missing = v => v === null || v === undefined
                    || (!spec.text && !isFinite(v));
  return [...list].sort((a, b) => {
    const x = spec.get(a), y = spec.get(b);
    /* A row with no cost is not the cheapest one: absent values go to the bottom
       whichever way round the column is turned. */
    if (missing(x) || missing(y)) return missing(x) && missing(y) ? 0 : (missing(x) ? 1 : -1);
    return sign * (spec.text ? String(x).localeCompare(String(y)) : x - y);
  });
}

/* Narrowing what is on screen, one control per column, under the column it acts
   on. It filters the rows the store already answered with -- it is not a second
   query -- so it is instant and it never changes what was paid for or ranked.

   A column whose values are few enough to list gets a dropdown, which is the
   whole point for a column holding 1 and >1: two values, one click. Anything else
   gets a box that matches as you type, and a numeric column also understands
   >x, <x, >=x and <=x. */
const filters = {};
const FILTER_COLUMNS = ['text', 'n', 'sum_logprob', 'mean_logprob', 'perplexity',
                        'group', 'change', 'cost', 'end'];
const RANGE = /^\s*(>=|<=|>|<|=)\s*(-?\d+(?:\.\d+)?)\s*$/;

function passesFilters(e) {
  for (const [key, want] of Object.entries(filters)) {
    if (!want) continue;
    const spec = SORTABLE[key];
    if (!spec) continue;
    const got = spec.get(e);
    if (spec.text || typeof got === 'string') {
      if (!String(got == null ? '' : got).toLowerCase().includes(String(want).toLowerCase())) return false;
      continue;
    }
    const m = RANGE.exec(want);
    if (m) {
      const n = Number(got), x = Number(m[2]);
      if (!isFinite(n)) return false;
      if (m[1] === '>' && !(n > x)) return false;
      if (m[1] === '<' && !(n < x)) return false;
      if (m[1] === '>=' && !(n >= x)) return false;
      if (m[1] === '<=' && !(n <= x)) return false;
      if (m[1] === '=' && !(n === x)) return false;
      continue;
    }
    if (!String(got == null ? '' : got).toLowerCase().includes(String(want).toLowerCase())) return false;
  }
  return true;
}

// document.getElementById, not el(): that helper is declared further down the
// file and this runs first.
const filterRow = document.getElementById('tfilter');

/* The header cells decide the shape: one control per header, in the same order,
   so the two rows cannot drift apart as columns come and go. */
function buildFilterRow(entries) {
  if (!filterRow) return;
  const heads = [...document.querySelectorAll('.thead > [data-sort]')];
  filterRow.innerHTML = '';
  for (const head of heads) {
    const key = head.dataset.sort;
    const cell = document.createElement('div');
    if (head.hidden || !FILTER_COLUMNS.includes(key)) { filterRow.appendChild(cell); continue; }
    const spec = SORTABLE[key];
    const values = [...new Set(entries.map(x => {
      const v = spec.get(x);
      return v === null || v === undefined ? '' : String(v);
    }))].filter(Boolean).sort();
    let control;
    if (values.length && values.length <= 12) {
      control = document.createElement('select');
      control.innerHTML = '<option value="">vše</option>'
        + values.map(v => `<option value="${escapeAttr2(v)}">${escapeAttr2(v)}</option>`).join('');
    } else {
      control = document.createElement('input');
      control.type = 'text';
      control.placeholder = spec.text ? 'obsahuje…' : '>0.5';
    }
    control.value = filters[key] || '';
    control.classList.toggle('on', !!filters[key]);
    control.title = `Filtr sloupce ${key}`;
    control.addEventListener('input', () => {
      filters[key] = control.value.trim();
      control.classList.toggle('on', !!filters[key]);
      renderRows();
    });
    control.addEventListener('click', ev => ev.stopPropagation());
    cell.appendChild(control);
    filterRow.appendChild(cell);
  }
}

const tfToggle = document.getElementById('tfToggle');
if (tfToggle) {
  tfToggle.addEventListener('click', ev => {
    ev.stopPropagation();          // the header it sits in sorts on click
    filterRow.hidden = !filterRow.hidden;
    tfToggle.classList.toggle('on', !filterRow.hidden);
    if (filterRow.hidden) {
      // Leaving it hidden with filters still on would be a table lying quietly.
      for (const k of Object.keys(filters)) delete filters[k];
      renderRows();
    } else if (DB) {
      buildFilterRow(DB.entries || []);
    }
  });
}

function paintSortMarks() {
  for (const head of document.querySelectorAll('.thead > [data-sort]')) {
    const on = !!localSort && localSort.key === head.dataset.sort;
    head.classList.toggle('sorted', on);
    const old = head.querySelector('.sortmark');
    if (old) old.remove();
    if (on) {
      const mark = document.createElement('span');
      mark.className = 'sortmark';
      mark.textContent = localSort.dir === 'asc' ? '▲' : '▼';
      head.appendChild(mark);
    }
    head.setAttribute('aria-sort', on ? (localSort.dir === 'asc' ? 'ascending' : 'descending') : 'none');
  }
}

function toggleSort(key) {
  if (!SORTABLE[key]) return;
  localSort = (localSort && localSort.key === key)
    ? {key, dir: localSort.dir === 'asc' ? 'desc' : 'asc'}
    : {key, dir: SORTABLE[key].first};
  if (DB) renderRows();
}

document.querySelector('.thead').addEventListener('click', ev => {
  const head = ev.target.closest('[data-sort]');
  if (head) toggleSort(head.dataset.sort);
});
document.querySelector('.thead').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const head = ev.target.closest('[data-sort]');
  if (!head) return;
  ev.preventDefault();
  toggleSort(head.dataset.sort);
});

/* Which tail columns the rows on screen justify. Decided once for the whole
   list, not per row: a grid whose rows carry different numbers of cells puts the
   numeric columns in a different place on every line. */
function tailColumns(entries) {
  return {
    change: entries.some(e => e.sweep || e.deviation !== undefined),
    end: entries.some(e => e.end || e.finish_reason),
  };
}

/* The string column's width, measured from the widest row and then applied to
   all of them. The property has to be cleared first: with it still set, every
   cell is already clamped to the previous measurement and the new one would
   only ever shrink. */
function measureTextColumn() {
  if (!(BAR.block && BAR.block('wide-rows'))) {
    tableEl.style.removeProperty('--textw');
    return;
  }
  tableEl.style.removeProperty('--textw');
  const cells = [...listEl.querySelectorAll('.row > .text')];
  if (!cells.length) return;
  const w = Math.max(...cells.map(c => c.scrollWidth));
  if (w > 0) tableEl.style.setProperty('--textw', w + 'px');
}

function buildRow(e, cols) {
  const row = document.createElement('div');
  row.className = 'row';

  /* The colour goes into a custom property, not straight into `background`. The
     bar's `colour` box then switches it with one class on <body>, with nothing to
     re-render -- an inline background could not be turned off that way. */
  const tokSpan = (t, i, extra) =>
    `<span class="tok${t.source === 'alt' ? ' alt' : ''}${extra}" data-i="${i}"
           style="--tc:${tokColor(t.logprob)}"
           title="${plain(t.token)}  logP=${fmt(t.logprob)}">${escapeToken(t.token)}</span>`;

  /* One 4096-token row would make the table scroll for a screen and a half and
     leave every other row unreadable, so when the list contains one, every row is
     cut to the first 20 tokens. All of them, not just the long one: rows cut to
     different lengths cannot be compared by eye, which is what the column is for. */
  const cap = window.ROW_TOKEN_CAP || 0;
  const x = e.extension;
  /* The continuation is appended to the row but stays visibly separate: it is not
     what the row was ranked by, and over the default top 200 ranking by the
     extended sum would reorder 11,325 of 19,900 pairs. */
  const shownToks = cap ? e.tokens.slice(0, cap) : e.tokens;
  const toks = shownToks.map((t, i) => tokSpan(t, i, '')).join('')
    + (cap && e.tokens.length > cap
        ? `<span class="capnote">… ${e.tokens.length - cap} more</span>` : '')
    + (x && x.added_n
        ? '<span class="extmark" title="everything after this point is the continuation, '
          + 'not part of what was ranked">›</span>'
          + x.tokens.map((t, i) => tokSpan(t, e.tokens.length + i, ' ext')).join('')
          + (x.detail_truncated
              ? `<span class="more"> …${x.added_n - x.tokens.length} more</span>` : '')
        : '');

  const openTitle = e.id
    ? 'Open this string on its own, in a new tab'
    : 'Open a recorded call beginning with this prefix, in a new tab — a prefix '
      + 'is a path in the token trie, not a call of its own';

  row.innerHTML = `
    <div class="rank">${e.rank}${x && x.same_as_rank
      ? `<span class="dup" title="an earlier row already extends to this same string">=${x.same_as_rank}</span>` : ''}</div>
    <div class="text" title="${openTitle}">${toks}</div>
    <div class="cell num c-n">${e.n}${x && x.added_n ? `<span class="subnum">+${x.added_n}</span>` : ''}</div>
    <div class="cell num key">${fmt(e.sum_logprob)}${x && x.added_n
      ? `<span class="subnum" title="the whole string; the ranking uses the value above">→ ${fmt(x.sum_logprob, 2)}</span>` : ''}</div>
    <div class="cell num c-mean">${fmt(e.mean_logprob)}</div>
    <div class="cell num c-ppl">${fmt(e.perplexity, 2)}</div>
    ${metaCells(e)}
    ${cols.change ? `<div class="c-change">${changeCell(e)}</div>
    <div class="cell num c-cost">${costCell(e)}</div>` : ''}
    ${cols.end ? `<div class="c-end">${endCell(e)}</div>` : ''}
    <div class="detail hide"></div>`;

  if (VIEW === 'greedy') {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'branch-icon'; button.textContent = '⑂';
    button.title = 'Jednotokenové odchylky: každá pozice × každá zaznamenaná '
      + 'alternativa je nový prompt (16 tokenů ≈ 300 řetězců). Pokračování se '
      + 'berou z databáze; pokud některá chybí, zeptá se, než zavolá API.';
    button.setAttribute('aria-label', 'Jednotokenové odchylky řetězce ' + e.rank);
    row.querySelector('.rank').appendChild(button);
    button.addEventListener('click', async ev => {
      ev.stopPropagation();
      if (window.branchRunning) return;
      window.branchRunning = true; button.disabled = true;
      const panel = document.createElement('div'); panel.className = 'branch-panel';
      panel.style.cssText = 'grid-column:1/-1;padding:12px;border:1px solid currentColor';
      const status = document.createElement('p'); panel.appendChild(status);
      row.after(panel);
      try {
        /* The only place here that may spend money, and every call is shown
           with its prompt and parameters before it goes out. On a swept base
           nothing is missing, so nothing is asked. */
        const result = await GreedyBranches.run(e, S.model || 'gpt-3.5-turbo-instruct',
          text => {status.textContent = text;},
          {approve: AskPolicy.guard,
           // A row's own tokens include the prompt on the views that carry one,
           // and a prompt has no logprobs, so no alternatives to deviate.
           fixed: e.prompt_len || 0});
        const parts = [`${result.count} odchylek`, `databáze ${result.from_store}`,
                       `API ${result.calls}`];
        if (result.stopped) parts.push('zastaveno');
        if (result.skipped) parts.push(`${result.skipped} přeskočeno`);
        if (result.missing_count) parts.push(`${result.missing_count} chybí`);
        if (result.failures && result.failures.length) parts.push(`${result.failures.length} volání selhalo`);
        if (result.eos_deviations) parts.push(`${result.eos_deviations}× konec textu (není co dogenerovat)`);
        // Two different partial answers, and they mean different things.
        if (result.capped) parts.push(`zastaveno na ${result.cell_cap} odchylkách — pozice 1–${result.planned_positions} z ${result.n}`);
        else if (result.positions_in_trie < result.n) parts.push(`za pozicí ${result.positions_in_trie} není v databázi nic, od čeho odbočit`);
        if (result.unscorable) parts.push(`${result.unscorable} neohodnotitelných`);
        status.textContent = parts.join(' · ');
        result.entries.forEach(entry => panel.appendChild(buildRow(entry)));
        button.disabled = true;
      } catch (error) {
        status.textContent = error.message;
        if (error.record) {
          const link = document.createElement('a'); link.textContent = 'Stáhnout neuloženou odpověď';
          link.href = URL.createObjectURL(new Blob([JSON.stringify(error.record)], {type:'application/json'})); link.download = 'completion-recovery.json'; panel.appendChild(link);
        } else button.disabled = false;
      } finally {window.branchRunning = false;}
    });
  }
  const detailEl = row.querySelector('.detail');

  // Click the string to open it on its own page; click the rest of the row to
  // expand it in place; click a token inside an expanded row to inspect that
  // position.
  for (const groupInput of row.querySelectorAll('.c-group input')) {
    if (groupInput.disabled) continue;
    // The row expands on click and the string opens a tab; neither should happen
    // because you put the caret in a cell.
    groupInput.addEventListener('click', ev => ev.stopPropagation());
    groupInput.addEventListener('change', () => saveGroup(groupInput));
    groupInput.addEventListener('blur', () => saveGroup(groupInput));
    groupInput.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') { ev.preventDefault(); groupInput.blur(); }
      if (ev.key === 'Escape') { groupInput.value = groupInput.dataset.saved || ''; groupInput.blur(); }
    });
  }

  row.addEventListener('click', ev => {
    const tokEl = ev.target.closest('.tok');
    if (tokEl && row.classList.contains('open')) {
      toggleTokenDetail(row, e, +tokEl.dataset.i);
      return;
    }
    /* Only while the row is closed. Once it is open the string is the thing you
       click token by token, and a new tab on every one of those would be a
       trap. */
    if (ev.target.closest('.text') && !row.classList.contains('open')) {
      openInViewer(e);
      return;
    }
    if (ev.target.closest('.detail')) return;   // don't collapse when using the panel
    const opening = !row.classList.contains('open');
    row.classList.toggle('open', opening);
    // An open row is the one record on screen, so the bar's `json` button has
    // something to show. Closing it takes that away again.
    openRowId = opening ? (e.id || null) : null;
    if (BAR.repaint) BAR.repaint();
    if (opening) renderRowHint(detailEl);
    else {
      detailEl.classList.add('hide');
      row.querySelectorAll('.tok.sel').forEach(s => s.classList.remove('sel'));
    }
  });

  return row;
}

function renderRows() {
  const q = currentPrefix();
  // The store already filters before the cap (which is why a separate file for
  // "I have" had to exist), so this is only instant feedback before it answers.
  const filtered = DB.entries.filter(passesFilters);
  const matching = q ? filtered.filter(e => matchesPrefix(e.text, q)) : filtered;
  // In ?file= mode nothing filters or caps server-side, so the cap applies here.
  const slice = LEGACY_FILE
    ? matching.slice(0, Number(S.top) || matching.length)
    : matching;


  listEl.textContent = '';
  if (!slice.length) {
    /* Name the filters. "Nothing here yet" was true and useless: with the details
       block off by default, nothing on screen said which settings had narrowed the
       result to zero, and a remembered one from an earlier session looks like a
       broken program. */
    const active = (BAR.activeFilters && BAR.activeFilters()) || [];
    const why = active.length
      ? '<div class="emptywhy">Filters in force: '
        + active.map(f => `<b>${f.label}</b> ${plain(String(f.value))
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')}`).join(' · ')
        + ' — one of these is excluding everything.</div>'
        + '<button type="button" id="emptyClear">clear the filters</button>'
      : '';
    listEl.innerHTML = `<div class="empty">No results.${
      q ? ` Nothing starts with <code>${plain(q).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code>.` : ''
    }</div>${why}`;
    const clear = document.getElementById('emptyClear');
    if (clear && BAR.clearFilters) clear.addEventListener('click', BAR.clearFilters);
    shownEl.textContent = '0 results';
    shownEl.classList.toggle('filtered', !!q);
    tableEl.hidden = false;
    return;
  }

  /* The shared display preference applies to every string on both result pages. */
  window.ROW_TOKEN_CAP = (BAR.tokenLimit && BAR.tokenLimit()) || 0;

  /* Decided before the rows are built, because every row has to agree with the
     header about how many cells there are. */
  const ordered = sortEntries(slice);
  const cols = tailColumns(ordered);
  const frag = document.createDocumentFragment();
  ordered.forEach(e => frag.appendChild(buildRow(e, cols)));
  listEl.appendChild(frag);
  paintSortMarks();

  if (filterRow && !filterRow.hidden) buildFilterRow(DB.entries || []);
  tableEl.classList.toggle('has-change', cols.change);
  tableEl.classList.toggle('has-end', cols.end);
  document.getElementById('thChange').hidden = !cols.change;
  document.getElementById('thCost').hidden = !cols.change;
  document.getElementById('thEnd').hidden = !cols.end;

  /* Short on purpose: it shares the bar with the colour key, and a long line
     wrapped the bar onto a second row. `records in store` and `unreachable` are
     both in the meta block below, so this keeps only what the bar is for --
     how much of the match is on screen. A prefixes view shows a sliver
     (50 of 176,649), and without the second number it reads as the whole answer. */
  const avail = DB.available != null && DB.available > slice.length
    ? ` of ${DB.available.toLocaleString('en-US')}` : '';
  shownEl.textContent = `${slice.length}${avail} results`;
  shownEl.classList.toggle('filtered', !!q);
  tableEl.hidden = false;
  /* After the table is shown, not before: [hidden] is display:none, so measuring
     while it was still hidden read every cell as zero wide and the column width
     was never set. */
  measureTextColumn();
}


const el = id => document.getElementById(id);

/* The meta block used to derive its label from db.view, which reads 'prefixes'
   for anything that is not completions -- and /api/greedy_alternatives answers
   with view 'greedy_alternatives', so the greedy list announced itself as a
   best-first prefix search. VIEW is what was asked for, so VIEW names it. */
const VIEW_LABEL = {
  completions: 'completions (prompt + generated)',
  prefixes: 'prefixes — best-first',
  greedy: 'greedy II — top-20 first-token branches',
  greedy1: 'greedy I — departures from all discovered strings',
  deviations: 'one-token deviations of one string',
};
const specialEl = document.getElementById('special');

/* The heading carries a quarter of the explanation, so it follows the view --
   "Prefixes by cumulative logprob" above an alternatives grid would simply lie. */
const BLURBS = {
  greedy1: ['Greedy I', 'Start with the greedy string. Choose a one-token departure from any discovered string, maximizing the sum of logprobs through the new token, then use its stored continuation. Only recorded continuations participate. Cost is the negative departure prefix sum. Rows follow discovery order; other sort columns reorder only the discovered set.'],
  greedy: ['Greedy II', 'One string for each of the top 20 first tokens after the starting prompt, followed by its stored continuation. The original greedy string represents the chosen token. Only this first position branches. Deviation cost orders these tokens by probability; later tokens do not affect that order.'],
  completions: ['Completions by cumulative logprob',
    'One entry per recorded call: the whole string it produced, prompt included. The strings '
    + 'are not all the same length (the prompt grows with the deviation position), so a sum '
    + 'favours the shorter ones — mean logprob is in the next column.'],
  prefixes: ['Prefixes by cumulative logprob',
    'Best-first (uniform-cost / Dijkstra) search over the token trie. Every logprob is ≤ 0, so '
    + 'extending a prefix can never raise its sum — which is what makes the order provably correct.'],
  sweep: ['Alternatives grid',
    'For each position of one base completion, all 20 alternatives the model offered there. '
    + 'The framed one is what it actually chose; the rest are the deviations we paid to see.'],
  deviations: ['One-token deviations',
    'Every position of one string × every alternative the model recorded there. Each one is a '
    + 'new prompt — tokens[:i] + alternative — and the row is what the model actually generates '
    + 'from it, so the tail after the change is real rather than the original tail kept. '
    + 'Continuations come from the database; the ones it does not have are fetched only when '
    + 'you ask, and that costs money.'],
  walk: ['Cheapest-deviation walk',
    'Each step takes the single-token change costing the fewest nats and regenerates the '
    + 'continuation. Computed from stored records only — it stops where a call would be needed.'],
};

function applyBlurb() {
  const [title, blurb] = BLURBS[VIEW] || BLURBS.prefixes;
  document.getElementById('title').textContent = title;
  document.getElementById('blurb').textContent = blurb;
}

/* Nothing here toggles a control any more -- the bar has them all. The blurb
   still follows the view, which is the one thing this page owns. */
function applyViewControls() { applyBlurb(); }

// ------------------------------------------------------------- deviations view
/* This was a page of its own (deviations.html). Its table, its number formatting
   and its whitespace markers were a second implementation of what is above, and
   it had no settings bar -- no colour key, no scope, no model. The parts that
   really are its own are here: what the set covers, and the one button that
   spends money. */
const planWrap = el('planwrap');

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Says what the answer covers before it says what is in it -- a partial set that
   looks whole is the one thing this view must not produce. */
function renderPlan(db) {
  const bits = [
    `<span><b>${db.deviations}</b> deviations of ${db.n} tokens</span>`,
    `<span><b>${db.from_store}</b> answered by the database</span>`,
  ];
  if (db.missing_count) bits.push(`<span class="paid"><b>${db.missing_count}</b> would need an API call</span>`);
  if (db.eos_deviations) bits.push(`<span><b>${db.eos_deviations}</b>× end-of-text — nothing to generate</span>`);
  if (db.duplicates) bits.push(`<span><b>${db.duplicates}</b> duplicate strings</span>`);
  if (db.unscorable) bits.push(`<span><b>${db.unscorable}</b> unscorable</span>`);
  if (db.capped) {
    bits.push(`<span class="capped">stopped at the ${db.cell_cap}-cell limit — positions
      1–${db.planned_positions} of ${db.n}</span>`);
  } else if (db.positions_in_trie < db.n) {
    bits.push(`<span class="capped">nothing recorded past position ${db.positions_in_trie}
      to depart from</span>`);
  }
  el('plan').innerHTML = bits.join('');
  const button = el('fetch');
  button.hidden = !db.missing_count;
  button.textContent = db.missing_count
    ? `Fetch the missing ${db.missing_count} — each one shown for approval first` : '';
  el('json').disabled = false;
  el('txt').disabled = false;
}

function renderDeviations(db) {
  specialEl.hidden = true;
  planWrap.hidden = false;
  el('base').textContent = db.base_text || '';
  el('promptWrap').hidden = !db.prompt;
  el('prompt').textContent = db.prompt || '';
  renderPlan(db);
  metaEl.innerHTML = `
    <div>ranked by: <b>${db.ranking || 'deviation cost'}</b></div>
    <div>view: <b>${VIEW_LABEL.deviations}</b></div>
    <div>base record: <b>${db.base_id || '—'}</b></div>
    <div>deviations: <b>${db.deviations}</b> of a ${db.n}-token string</div>
    <div>answered by the database: <b>${db.from_store}</b></div>
    <div>needing a call: <b>${db.missing_count}</b></div>
    <div>model: <b>${db.model || '—'}</b></div>`;
  renderRows();
}

/* The only control on this page that spends anything, and it says how much in
   its own label before it is pressed. */
el('fetch').addEventListener('click', async () => {
  const db = DB;
  if (!db || !db.missing_count) return;
  const button = el('fetch'), status = el('planstatus');
  button.disabled = true;
  const model = S.model || db.model || 'gpt-3.5-turbo-instruct';
  /* The given prompt belongs in here, with `fixed` saying how much of it is the
     prompt. Without it a re-plan walks the trie from the root instead of from
     the prompt node, nothing scores, and the rows that were there vanish -- the
     same mistake as sending a deviation without its tokenisation. */
  const promptTokens = db.prompt_tokens || [];
  const parent = {
    tokens: [...promptTokens, ...(db.base_tokens || [])].map(t => ({token: t})),
    text: (db.prompt || '') + (db.base_text || ''),
  };
  const planOpts = {fixed: promptTokens.length, base_id: db.base_id};
  const show = fresh => { fresh.__route = '/api/deviations'; render(fresh); };
  try {
    /* Every call is shown and approved on its own -- the prompt and the exact
       parameters -- so there is no summary dialog in front of it. */
    const out = await GreedyBranches.fill(parent, model, db, {
      ...planOpts,
      progress: t => { status.textContent = t; },
      // The policy decides whether the dialog appears at all; guard() shows it
      // when it should and answers 'yes' when the policy says not to ask.
      approve: AskPolicy.guard,
      /* Re-plan and redraw as each answer lands, so the new string is a row in
         the table straight away rather than at the end of the run. The rows
         still come from the server, so a row bought a minute ago and one bought
         just now are scored by the same code. */
      onResult: async (record, cell, n, total) => {
        const choice = ((record && record.choices) || [{}])[0] || {};
        const box = el('last');
        box.hidden = false;
        box.textContent = '';
        const head = document.createElement('b');
        head.textContent = `${n}/${total} · position ${cell.position + 1} · `
          + `${JSON.stringify(cell.original)} → ${JSON.stringify(cell.alternative)}`
          + (choice.finish_reason ? ` · ${choice.finish_reason}` : '') + '\n';
        box.appendChild(head);
        box.appendChild(document.createTextNode(choice.text || '(no text)'));
        try {
          const fresh = await GreedyBranches.plan(parent, model, planOpts);
          if (!fresh.error) show(fresh);
          status.textContent = `${n}/${total} · ${fresh.from_store} in the table`;
        } catch { /* the run goes on; the rows catch up at the end */ }
      },
    });
    show(out);
    const bits = [`${out.count} strings`, `${out.calls} API calls`];
    if (out.skipped) bits.push(`${out.skipped} skipped`);
    if (out.stopped) bits.push('stopped');
    // The reason, not just the count: a run that ends "245 failed" and nothing
    // else leaves you guessing at exactly the moment you most want to know.
    if (out.failures && out.failures.length) {
      bits.push(`${out.failures.length} failed — ${out.firstFailure || 'no reason given'}`);
    }
    status.textContent = bits.join(' · ');
  } catch (err) {
    status.textContent = err.message;
    if (err.record) {
      // A paid answer that could not be saved is offered rather than lost.
      const a = document.createElement('a');
      a.textContent = ' download the unsaved answer';
      a.href = URL.createObjectURL(new Blob([JSON.stringify(err.record)], {type: 'application/json'}));
      a.download = 'completion-recovery.json';
      status.appendChild(a);
    }
  } finally {
    button.disabled = false;
  }
});

el('json').addEventListener('click', () =>
  download('deviations.json', JSON.stringify(DB, null, 2), 'application/json'));
el('txt').addEventListener('click', () =>
  download('deviations.txt', (DB.entries || []).map(e => e.text).join('\n'), 'text/plain'));

function renderSweep(db) {
  tableEl.hidden = true;
  specialEl.hidden = false;
  metaEl.innerHTML = `
    <div>view: <b>alternatives grid</b></div>
    <div>base: <b>${db.base_found ? 'found' : 'MISSING'}</b></div>
    <div>tokens in base: <b>${db.base_tokens.length}</b></div>
    <div>positions: <b>${db.positions.length}</b></div>
    <div>calls in grid: <b>${db.cells}</b></div>`;

  if (!db.positions.length) {
    specialEl.innerHTML = '<div class="empty">No deviations recorded for this base.</div>';
    shownEl.textContent = '';
    return;
  }

  specialEl.innerHTML = db.positions.map(p => {
    const chips = p.alternatives.map(a => {
      const lp = a.alternative_logprob;
      return `<span class="alt-chip${a.is_greedy ? ' greedy' : ''}" title="${
        escapeAttr((a.text || '').slice(0, 160))}">${plain(a.alternative)
        }<span class="lp">${lp == null ? '' : fmt(lp, 2)}</span></span>`;
    }).join('');
    return `<div class="prow">
      <div class="pi">${p.position}</div>
      <div class="base">${plain(db.base_tokens[p.position] ?? '')}</div>
      <div class="alts">${chips}</div>
    </div>`;
  }).join('');
  shownEl.textContent = `${db.positions.length} positions · ${db.cells} calls`;
}

function renderWalk(db) {
  tableEl.hidden = true;
  specialEl.hidden = false;
  metaEl.innerHTML = `
    <div>view: <b>cheapest-deviation walk</b></div>
    <div>steps from store: <b>${db.steps.length}</b></div>
    <div>base Σ logprob: <b>${db.base ? fmt(db.base.sum) : '—'}</b></div>
    <div>tokens after a deviation: <b>${db.extend}</b></div>
    <div>positions: <b>${db.forward_only ? 'forward only' : 'unrestricted'}</b></div>`;

  const rows = [`<div class="wrow"><div>0</div><div>—</div><div>base</div><div>—</div>
      <div>${db.base.n}</div><div>${fmt(db.base.sum)}</div></div>
    <div class="wtext">${plain(db.base.text)}</div>`];

  for (const s of db.steps) {
    rows.push(`<div class="wrow">
      <div>${s.step}</div><div>${s.position}</div>
      <div>${plain(s.original)} → ${plain(s.alternative)}</div>
      <div class="cost">${fmt(s.cost)}</div>
      <div>${s.n}</div><div>${fmt(s.sum)}</div>
    </div><div class="wtext">${plain(s.text)}</div>`);
  }

  // Where the walk would continue only past a paid call. Said out loud, so that
  // "8 steps" is not read as "this is the end".
  if (db.needs_call) {
    const nc = db.needs_call;
    rows.push(`<div class="needs">The next step would need <b>1 API call</b>:
      position ${nc.position}, <b>${plain(nc.original)} → ${plain(nc.alternative)}</b>,
      deviation cost <b>${fmt(nc.cost)}</b>. That prompt is not in the store, so the walk
      stops here.</div>`);
  } else if (!db.steps.length) {
    rows.push('<div class="empty">No step can be taken from the stored records.</div>');
  }

  specialEl.innerHTML = rows.join('');
  shownEl.textContent = `${db.steps.length} steps`
    + (db.needs_call ? ' · the next one needs a call' : '');
}

function render(db) {
  DB = db;
  window.__db = db;   // handy for poking at the data from the console
  /* The route the data on screen actually came from. It used to be set once at
     startup, so every view claimed /api/query -- greedy and walk and the grid
     included, none of which read that route. A provenance label that names the
     wrong source is worse than none. */
  document.getElementById('srcName').textContent =
    LEGACY_FILE || db.__route || '/api/query';
  planWrap.hidden = VIEW !== 'deviations';
  if (VIEW === 'sweep') return renderSweep(db);
  if (VIEW === 'walk')  return renderWalk(db);
  if (VIEW === 'deviations') return renderDeviations(db);
  specialEl.hidden = true;

  metaEl.innerHTML = `
    <div>ranked by: <b>${db.ranking || 'Σ logprob, descending'}</b></div>
    ${(VIEW === 'greedy' || VIEW === 'greedy1') ? `<div>departures ranked: <b>${db.departures_ranked}</b></div>
      <div>departures needing a call: <b>${db.departures_without_record}</b></div>` : ''}
    <div>view: <b>${VIEW_LABEL[VIEW] || VIEW}</b></div>
    ${db.end_counts ? `<div>scope: <b>${db.ends ? db.ends.join(' + ') : 'every ending'}</b>
      — ${Object.entries(db.end_counts).map(([k, v]) => `${v}&nbsp;${k}`).join(', ') || 'nothing'}</div>` : ''}
    ${db.truncated_by_budget ? `<div class="warn">the trie search hit its ${db.search_pops}-step
      budget before filling the list, so more matching strings may exist below the last row</div>` : ''}
    ${db.available != null ? `<div>shown: <b>${db.count}</b> of <b>${db.available}</b>${
      db.trie_total ? ` matching · ${db.trie_total} prefixes in the trie, ${db.unreachable}
      unreachable — ${db.unreachable_unscored} of them because a path may not pass a token
      with no known logprob${db.unreachable > db.unreachable_unscored
        ? `, the other ${db.unreachable - db.unreachable_unscored} because they hold a
           recovered token and this setting excludes those` : ''}` : ''}</div>` : ''}
    ${db.chosen_only_note ? `<div>tokens: <b>${db.chosen_only_note}</b></div>` : ''}
    ${db.node_counts ? `<div>continuation: <b>${db.nodes ? db.nodes.join(' + ') : 'either'}</b>
      — ${Object.entries(db.node_counts).map(([k, v]) => `${v}&nbsp;${k}`).join(', ') || 'nothing'}</div>` : ''}
    ${db.extend ? `<div>rows extended: <b>${db.distinct_extended}</b> distinct strings from
      ${db.entries.length} rows — the ranking is still over the prefix, and extending would
      reorder it</div>` : ''}
    <div>records in store: <b>${db.source_records}</b></div>
    <div>results computed: <b>${db.entries.length}</b></div>
    <div>sources: <b>${db.generated_from}</b></div>
    <div>model filter: <b>${db.model_filter || 'none'}</b></div>
    ${db.prefix_filter ? `<div>starts with: <b>"${db.prefix_filter}"</b></div>` : ''}
    <div>chosen tokens only: <b>${db.chosen_only ? 'yes' : 'no'}</b></div>`;

  renderRows();
}

/* Where the data comes from.

   This used to be a frozen export: dijkstra_top.json had been built from 391
   records while 8492 existed, and contained no sweep data at all. The same query
   now goes to the store, which holds every record, so a ranking cannot go stale.

   ?file=… still works, for a plain static server or to look at one historical
   slice deliberately. */
const PARAMS = new URLSearchParams(location.search);
const LEGACY_FILE = PARAMS.get('file');
let VIEW = PARAMS.get('view') || 'prefixes';


/* Built entirely from the bar's state, so there is one place a setting can come
   from. Everything ticked means the same as no filter, and leaving the parameter
   off then keeps the store's fast path -- and old links -- as they were. */
function queryUrl() {
  if (VIEW === 'sweep') {
    const p = new URLSearchParams();
    if (S.base_id) p.set('base_id', S.base_id);
    return '/api/sweep?' + p.toString();
  }
  if (VIEW === 'deviations') {
    const p = new URLSearchParams();
    if (S.base_id) p.set('base_id', S.base_id);
    if (S.model) p.set('model', S.model);
    p.set('sort', effectiveSort());
    if (S.ends) p.set('ends', S.ends);
    if (S.nodes) p.set('nodes', S.nodes);
    if (S.sources) p.set('sources', S.sources);
    return '/api/deviations?' + p.toString();
  }
  if (VIEW === 'walk') {
    return '/api/walk?' + new URLSearchParams({
      steps: String(S.steps || 20),
      forward_only: S.forward_only ? '1' : '0',
      ...(S.base_id ? { base_id: S.base_id } : {}),
    }).toString();
  }
  const p = new URLSearchParams({ top: String(S.top ?? ((VIEW === 'greedy' || VIEW === 'greedy1') ? 20 : 200)) });
  /* The model was never sent. So picking davinci-002 changed the address and
     nothing else: the ranking still came back over every model, which reads as
     the setting being ignored -- and it was. */
  if ((VIEW === 'greedy' || VIEW === 'greedy1')) p.set('model', S.model || 'gpt-3.5-turbo-instruct');
  else if (S.model) p.set('model', S.model);
  if (S.ends) p.set('ends', S.ends);
  if (S.nodes) p.set('nodes', S.nodes);
  if (S.extend) p.set('extend', '1');
  if (S.sources) p.set('sources', S.sources);
  if ((VIEW === 'greedy' || VIEW === 'greedy1')) {
    p.set('sort', effectiveSort());
    if (S.prompt) p.set('prompt', S.prompt);
    return (VIEW === 'greedy1' ? '/api/greedy_i?' : '/api/greedy_alternatives?') + p.toString();
  }
  p.set('view', VIEW);
  if (S.prefix) p.set('prefix', S.prefix);
  if (VIEW === 'completions') p.set('sort', effectiveSort());
  if (VIEW === 'prefixes' && S.chosen_only) p.set('chosen_only', '1');
  return '/api/query?' + p.toString();
}

function showError(what, err, hint) {
  errEl.style.display = 'block';
  errEl.textContent = `Could not load ${what}: ${err.message}` + (hint ? '  — ' + hint : '');
}

let inflight = 0;
async function load() {
  const seq = ++inflight;
  const url = LEGACY_FILE || queryUrl();
  shownEl.textContent = 'loading…';
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const db = await r.json();
    if (seq !== inflight) return;      // typing faster than the store answers
    // The route that actually produced THIS payload. Recomputing it at render
    // time read the current VIEW instead, so a response arriving after a switch
    // was labelled with the view the user had just moved to.
    db.__route = url.split('?')[0];
    errEl.style.display = 'none';
    /* No replaceState here any more. The bar puts every setting in the address
       before it navigates, so rewriting the address from this page's own reading
       of the state was just a second chance for the two to disagree -- and they
       did: it dropped `top` and resurrected a stale `sort`. */
    render(db);
  } catch (err) {
    if (seq !== inflight) return;
    if (LEGACY_FILE) {
      showError(LEGACY_FILE, err,
        'generate it: py export_dijkstra_top.py <data>.json --top 500 -o ' + LEGACY_FILE);
    } else {
      showError('/api/query', err,
        'is server.py running? start it: py server.py   (a plain static server has no API, '
        + 'and then only ?file=… works)');
    }
    shownEl.textContent = '';
  }
}

/* The full-text setting changes what is rendered, not only how it looks: the
   token cap depends on it. So this redraws rather than relying on the class. */
window.addEventListener('blockschange', () => { if (DB) renderRows(); });
window.addEventListener('tokenlimitchange', () => { if (DB) renderRows(); });

(async () => {
  applyViewControls();
  // The grid and the walk need a base_id the bar resolves with a fetch; without
  // waiting, the first query goes out with none and /api/sweep answers 400.
  await (BAR.ready || Promise.resolve());
  // Before the first render, so the labels are in the first paint rather than
  // appearing a moment later in cells you may already be typing in.
  await loadAnnotations();
  load();
})();
</script>
</body>
</html>
