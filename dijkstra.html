<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Dijkstra Top — logprob prefixes</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #fbfbfa;
    --card: #ffffff;
    --ink: #1a1a18;
    --ink-dim: #6b6b66;
    --ink-faint: #9a9a94;
    --line: #e5e4e0;
    --line-soft: #efeeeb;
    --accent: #3d5a80;
    --mid: #b07d2b;
    --bad: #a63d40;
    --chip: #f2f1ee;
    --hover: #f7f6f4;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #1f1f24;
      --ink: #e8e8e4;
      --ink-dim: #a0a09a;
      --ink-faint: #6e6e68;
      --line: #2e2e34;
      --line-soft: #26262b;
      --accent: #8ab0d9;
      --mid: #e0b060;
      --bad: #e08588;
      --chip: #2a2a30;
      --hover: #25252b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.2);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { margin-bottom: 1.5rem; }
  h1 { margin: 0 0 .35rem; font-size: 1.5rem; letter-spacing: -.01em; font-weight: 620; }
  .sub { color: var(--ink-dim); font-size: .875rem; }
  .sub code { background: var(--chip); padding: .1em .35em; border-radius: 4px; font-size: .92em; }

  .meta {
    display: flex; flex-wrap: wrap; gap: .4rem 1.5rem;
    margin-top: 1rem; padding: .7rem .9rem;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow);
    font-size: .8125rem;
  }
  .meta div { color: var(--ink-dim); }
  .meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0 .6rem; flex-wrap: wrap; }
  .controls label { font-size: .8125rem; color: var(--ink-dim); display: flex; align-items: center; gap: .4rem; cursor: pointer; }
  .controls select {
    font: inherit; font-size: .8125rem; color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; padding: .2rem .4rem; cursor: pointer;
  }
  .shown { font-size: .78125rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .controls input[type=text] {
    font: inherit; font-size: .8125rem; font-family: ui-monospace, Menlo, monospace;
    color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; padding: .2rem .4rem; width: 11rem;
  }
  .controls input[type=text]:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
  #prefixClear { font: inherit; font-size: .875rem; line-height: 1; cursor: pointer;
    color: var(--ink-dim); background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; padding: .15rem .4rem; }
  .shown.filtered { color: var(--accent); font-weight: 600; }
  .legend { display: flex; align-items: center; gap: .5rem; margin-left: auto; font-size: .75rem; color: var(--ink-faint); }
  .legend .ramp { width: 90px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, var(--bad), var(--mid), rgba(45,160,110,.75)); }

  /* --- compact one-line-per-entry table --- */
  .table {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 9px; box-shadow: var(--shadow); overflow: hidden;
  }
  .thead, .row {
    display: grid;
    grid-template-columns: 3rem minmax(0,1fr) 3.5rem 6rem 6rem 5.5rem;
    gap: .85rem; align-items: center;
    padding: .3rem .9rem;
  }
  /* only when the source data is a sweep and carries provenance */
  .has-sweep .thead, .has-sweep .row {
    grid-template-columns: 3rem minmax(0,1fr) 3.5rem 6rem 6rem 5.5rem 7rem;
  }
  .c-sweep { font-size: .71875rem; color: var(--ink-faint);
    font-family: ui-monospace, Menlo, monospace; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .c-sweep .pos { color: var(--accent); font-weight: 600; }
  .c-sweep .onpath { color: var(--good); }
  .c-sweep .stopped { color: var(--bad); font-weight: 600; }
  .c-sweep .ncalls { color: var(--mid); }   /* stejny retezec z vice volani */
  .thead {
    position: sticky; top: 0; z-index: 5;
    background: var(--card); border-bottom: 1px solid var(--line);
    font-size: .6875rem; text-transform: uppercase; letter-spacing: .045em;
    color: var(--ink-faint); font-weight: 600; padding-top: .5rem; padding-bottom: .5rem;
  }
  .thead .num, .row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .thead .key { color: var(--accent); }

  .row { border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--hover); }
  .row.open { background: var(--hover); }

  .rank { font: 600 .8125rem/1 ui-monospace, Menlo, monospace; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; }
  .row.open .rank { color: var(--accent); }

  .text {
    font: 13px/1.65 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .row.open .text { white-space: normal; overflow: visible; word-break: break-word; padding: .25rem 0; }

  .tok {
    display: inline-block; padding: .02em .24em; margin: 0 1px 1px 0;
    border-radius: 3px; border-bottom: 2px solid transparent;
  }
  .row.open .tok { cursor: pointer; }
  .row.open .tok:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
  .tok.sel { background: var(--accent) !important; color: var(--card); }
  .tok .ctrl { color: var(--ink-faint); font-size: .85em; }
  .tok.sel .ctrl { color: var(--card); opacity: .75; }
  .tok.alt { border-bottom-color: var(--mid); border-bottom-style: dotted; }

  .cell { font-size: .78125rem; color: var(--ink-dim); font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Menlo, monospace; }
  .cell.key { color: var(--accent); font-weight: 600; }

  .detail {
    grid-column: 1 / -1;
    margin: .1rem 0 .5rem; padding: .65rem .8rem;
    background: var(--chip); border-radius: 7px; font-size: .8125rem;
    cursor: default;
  }
  .detail.hide { display: none; }
  .detail .dh { font-weight: 600; margin-bottom: .4rem; font-family: ui-monospace, Menlo, monospace; }
  .detail .dh .src { font-family: system-ui, sans-serif; font-weight: 500; font-size: .8125rem;
    color: var(--ink-dim); margin-left: .5rem; }
  .detail table { border-collapse: collapse; max-width: 420px; }
  .detail td { padding: .1rem .6rem .1rem 0; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Menlo, monospace; font-size: .78125rem; }
  .detail td.num { color: var(--ink-dim); text-align: right; }
  .detail tr.this td { color: var(--accent); font-weight: 600; }
  .detail .none, .detail .hint { color: var(--ink-faint); font-style: italic; }

  #err { color: var(--bad); padding: 1rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; }

  @media (max-width: 720px) {
    .thead, .row { grid-template-columns: 2.5rem minmax(0,1fr) 5.5rem; }
    .thead .c-mean, .row .c-mean, .thead .c-ppl, .row .c-ppl,
    .thead .c-n, .row .c-n { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nejlepší prefixy podle součtu logprobs</h1>
    <div class="sub">
      Best-first (Dijkstra) prohledávání token-trie. Každý logprob je ≤ 0, takže prodloužení
      prefixu součet nikdy nezvýší — pořadí vytahování z haldy je proto zaručeně správné.
      Data: <code id="srcName">dijkstra_top.json</code>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="controls">
    <!-- Drive z osmi datasetu na dva pohledy: ty tri "L1 / L1+L2 / L1+L2+L3"
         se lisily jen tim, kolik dat tehdy existovalo, a server vidi vsechna.
         Filtrovana sada („I have") je ted jen text v poli "zacina na". -->
    <label for="dataSel">zobrazit:
      <select id="dataSel">
        <option value="prefixes">best-first — prefixy</option>
        <option value="completions">celé completions</option>
      </select>
    </label>
    <label for="limitSel">položek:
      <select id="limitSel"></select>
    </label>
    <label for="prefixIn">začíná na:
      <input type="text" id="prefixIn" placeholder="např. I have" spellcheck="false">
      <button id="prefixClear" type="button" title="zrušit filtr" hidden>×</button>
    </label>
    <span class="shown" id="shown"></span>
    <div class="legend">
      <span>nejistý</span><span class="ramp"></span><span>jistý</span>
    </div>
  </div>

  <div class="table" id="table" hidden>
    <div class="thead">
      <div>#</div>
      <div>prefix</div>
      <div class="num c-n">délka</div>
      <div class="num key">Σ logP</div>
      <div class="num c-mean">⌀ logP</div>
      <div class="num c-ppl">ppl</div>
      <div class="c-sweep" id="thSweep" hidden>odbočka</div>
    </div>
    <div id="list"></div>
  </div>
  <div id="err" style="display:none"></div>
</div>

<script>
const listEl  = document.getElementById('list');
const tableEl = document.getElementById('table');
const metaEl  = document.getElementById('meta');
const errEl   = document.getElementById('err');
const limitSel = document.getElementById('limitSel');
const dataSel  = document.getElementById('dataSel');
const prefixIn = document.getElementById('prefixIn');
const prefixClear = document.getElementById('prefixClear');

const PREFIX_KEY = 'dijkstra_prefix';

/* Filtr "zacina na": porovnava se surovy text vcetne bilych znaku, ne to, co
   je videt v tabulce (tam se \n zobrazuje jako ⏎). Vetsina retezcu zacina
   newline, takze hledani "I have" by pri striktnim prefixu nenaslo nic —
   pocatecni bile znaky se proto pri porovnani ignoruji. */
function matchesPrefix(text, q) {
  if (!q) return true;
  return text.startsWith(q) || text.replace(/^\s+/, '').startsWith(q);
}

function currentPrefix() { return prefixIn.value; }
const shownEl  = document.getElementById('shown');

const LIMIT_KEY = 'dijkstra_limit';

let DB = null;

// Render control characters visibly — otherwise a token that is purely "\n" or
// " " renders as nothing at all and the row looks empty.
function escapeToken(t) {
  const out = [];
  for (const ch of t) {
    if (ch === '\n') out.push('<span class="ctrl">⏎</span>');
    else if (ch === '\t') out.push('<span class="ctrl">⇥</span>');
    else if (ch === ' ') out.push('<span class="ctrl">␣</span>');
    else if (ch === '\ufeff') out.push('<span class="ctrl">[BOM]</span>');
    else out.push(ch.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
  }
  return out.join('');
}
function plain(t) {
  return t.replace(/\n/g,'\\n').replace(/\t/g,'\\t').replace(/ /g,'␣').replace(/\ufeff/g,'[BOM]');
}

// Colour a token by its probability: near-1 reads as "confident", near-0 as
// "the model was genuinely choosing". Alpha-only so it works in both themes.
function tokColor(logprob) {
  const p = Math.exp(logprob);
  const a = 0.10 + 0.55 * Math.min(1, p);
  if (p > 0.6)  return `rgba(45,160,110,${a})`;
  if (p > 0.15) return `rgba(200,150,50,${a})`;
  return `rgba(190,70,75,${Math.max(0.12, a)})`;
}

function fmt(x, d = 4) { return Number(x).toFixed(d); }

// Named (rather than inline in the click handler) so the detail rendering can be
// exercised directly, without a real mouse event.
function toggleTokenDetail(row, entry, index) {
  const detailEl = row.querySelector('.detail');
  const el = row.querySelector(`.tok[data-i="${index}"]`);
  const t = entry.tokens[index];
  if (!el || !t) return;

  const wasSel = el.classList.contains('sel');
  row.querySelectorAll('.tok.sel').forEach(s => s.classList.remove('sel'));
  if (wasSel) { renderRowHint(detailEl); return; }
  el.classList.add('sel');

  const alts = t.alternatives || [];
  const rows = alts.length
    ? `<table>${alts.map(a => `
        <tr class="${a.token === t.token ? 'this' : ''}">
          <td>${plain(a.token)}</td>
          <td class="num">${fmt(a.logprob, 3)}</td>
          <td class="num">${fmt(Math.exp(a.logprob), 5)}</td>
        </tr>`).join('')}</table>`
    : `<div class="none">Pro tuto pozici nejsou v datech uložené alternativy.</div>`;

  detailEl.innerHTML = `
    <div class="dh">„${plain(t.token)}"
      <span class="src">logP ${fmt(t.logprob)} · p ${fmt(Math.exp(t.logprob), 5)}
      · kumulativně ${fmt(t.cumulative)} · zdroj: ${t.source === 'alt' ? 'top_logprobs (alternativa)' : 'vygenerovaný token'}</span>
    </div>${rows}`;
  detailEl.classList.remove('hide');
}

function renderRowHint(detailEl) {
  detailEl.innerHTML = `<div class="hint">Klikni na token výše a uvidíš jeho logprob a alternativy, které model na té pozici vážil.</div>`;
  detailEl.classList.remove('hide');
}

function buildRow(e) {
  const row = document.createElement('div');
  row.className = 'row';

  const toks = e.tokens.map((t, i) =>
    `<span class="tok${t.source === 'alt' ? ' alt' : ''}" data-i="${i}"
           style="background:${tokColor(t.logprob)}"
           title="${plain(t.token)}  logP=${fmt(t.logprob)}">${escapeToken(t.token)}</span>`
  ).join('');

  row.innerHTML = `
    <div class="rank">${e.rank}</div>
    <div class="text">${toks}</div>
    <div class="cell num c-n">${e.n}</div>
    <div class="cell num key">${fmt(e.sum_logprob)}</div>
    <div class="cell num c-mean">${fmt(e.mean_logprob)}</div>
    <div class="cell num c-ppl">${fmt(e.perplexity, 2)}</div>
    ${e.sweep ? `<div class="c-sweep">${e.sweep.is_greedy
        ? '<span class="onpath">on-path</span>'
        : `<span class="pos">${e.sweep.position}</span> ${plain(e.sweep.alternative)}`}${
        e.finish_reason && e.finish_reason !== 'length'
          ? ` <span class="stopped">·${e.finish_reason}</span>` : ''}${
        e.n_calls > 1 ? ` <span class="ncalls">×${e.n_calls}</span>` : ''}</div>` : ''}
    <div class="detail hide"></div>`;

  const detailEl = row.querySelector('.detail');

  // Click the row to expand it (full text + per-token inspection); click a token
  // inside an expanded row to inspect that position.
  row.addEventListener('click', ev => {
    const tokEl = ev.target.closest('.tok');
    if (tokEl && row.classList.contains('open')) {
      toggleTokenDetail(row, e, +tokEl.dataset.i);
      return;
    }
    if (ev.target.closest('.detail')) return;   // don't collapse when using the panel
    const opening = !row.classList.contains('open');
    row.classList.toggle('open', opening);
    if (opening) renderRowHint(detailEl);
    else {
      detailEl.classList.add('hide');
      row.querySelectorAll('.tok.sel').forEach(s => s.classList.remove('sel'));
    }
  });

  return row;
}

function renderRows() {
  const q = currentPrefix();
  // Server uz filtruje pred limitem (proto existoval samostatny soubor pro
  // „I have"), takze tohle je jen okamzita odezva, nez dorazi novy dotaz.
  const matching = q ? DB.entries.filter(e => matchesPrefix(e.text, q)) : DB.entries;
  // V rezimu ?file= server nefiltruje ani neomezuje, takze limit plati tady.
  const slice = LEGACY_FILE
    ? matching.slice(0, Number(limitSel.value) || matching.length)
    : matching;

  prefixClear.hidden = !q;

  listEl.textContent = '';
  if (!slice.length) {
    listEl.innerHTML = q
      ? `<div class="empty">Žádný řetězec nezačíná na <code>${plain(q)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code>.</div>`
      : '<div class="empty">Zatím žádné prefixy.</div>';
    shownEl.textContent = `0 položek · ${DB.source_records} záznamů ve zdroji`;
    shownEl.classList.toggle('filtered', !!q);
    tableEl.hidden = false;
    return;
  }

  const frag = document.createDocumentFragment();
  slice.forEach(e => frag.appendChild(buildRow(e)));
  listEl.appendChild(frag);

  const anySweep = slice.some(e => e.sweep);
  tableEl.classList.toggle('has-sweep', anySweep);
  document.getElementById('thSweep').hidden = !anySweep;

  // Polozky nejsou zaznamy: 500 prefixu muze vzejit ze 401 volani, takze
  // "500 z 401" by bylo matouci — obe cisla proto rikaji, co jsou.
  shownEl.textContent = q
    ? `${slice.length} položek odpovídá „${plain(q)}" · ${DB.source_records} záznamů ve zdroji`
    : `${slice.length} položek · ${DB.source_records} záznamů ve zdroji`;
  shownEl.classList.toggle('filtered', !!q);
  tableEl.hidden = false;
}

/* Limit uz neurcuje, kolik z nactenych polozek se vykresli — je to `top`
   dotazu, tedy kolik jich server vubec spocita. Kroky jsou proto fixni, ne
   odvozene z toho, co je prave nactene. Strop 2000: completions nesou detail
   kazdeho tokenu, takze 600 polozek je ~7,5 MB a 5000 uz 72 MB. */
const POOL_STEPS = [20, 50, 100, 200, 500, 1000, 2000];

function setupLimitControl() {
  if (limitSel.options.length) return;          // jen jednou, ne pri kazdem dotazu
  limitSel.innerHTML = POOL_STEPS.map(n => `<option value="${n}">${n}</option>`).join('');
  let saved = Number(localStorage.getItem(LIMIT_KEY));
  limitSel.value = String(POOL_STEPS.includes(saved) ? saved : 200);
  limitSel.addEventListener('change', () => {
    try { localStorage.setItem(LIMIT_KEY, limitSel.value); } catch {}
    load();
  });
}

dataSel.addEventListener('change', () => {
  VIEW = dataSel.value;
  load();
});

let prefixTimer = null;
prefixIn.addEventListener('input', () => {
  clearTimeout(prefixTimer);
  if (DB) renderRows();                // okamzita odezva nad tim, co je nactene
  // ...a pak dotaz na server, ktery filtruje pred limitem, takze projdou i
  // shody hluboko v zebricku, na ktere by lokalni filtr nikdy nedosahl.
  prefixTimer = setTimeout(() => {
    try { localStorage.setItem(PREFIX_KEY, prefixIn.value); } catch {}
    load();
  }, 350);
});
prefixClear.addEventListener('click', () => {
  prefixIn.value = '';
  try { localStorage.removeItem(PREFIX_KEY); } catch {}
  load();
  prefixIn.focus();
});

function render(db) {
  DB = db;
  window.__db = db;   // handy for poking at the data from the console
  document.getElementById('srcName').textContent = SOURCE_LABEL;
  dataSel.value = db.view;

  metaEl.innerHTML = `
    <div>řazeno podle: <b>Σ logP (součet), sestupně</b></div>
    <div>pohled: <b>${db.view === 'completions'
        ? 'celé completions (prompt + vygenerované)' : 'prefixy'}</b></div>
    <div>záznamů ve zdroji: <b>${db.source_records}</b></div>
    <div>${db.view === 'completions' ? 'completions' : 'prefixů'} v databázi:
        <b>${db.entries.length}</b></div>
    <div>zdroj: <b>${db.generated_from}</b></div>
    <div>filtr modelu: <b>${db.model_filter || '—'}</b></div>
    ${db.prefix_filter ? `<div>sada předfiltrovaná na: <b>„${db.prefix_filter}"</b></div>` : ''}
    <div>jen „chosen" tokeny: <b>${db.chosen_only ? 'ano' : 'ne'}</b></div>`;

  setupLimitControl();
  renderRows();
}

/* Zdroj dat.

   Doted to byl zamrzly export: dijkstra_top.json byl postaveny ze 391 zaznamu,
   kdyz jich existovalo 8492, a nevidel ani jeden sweep. Ted se stejny dotaz
   posila do storu, ktery drzi vsechny zaznamy, takze zebricek nemuze zestarnout.

   ?file=… porad funguje — kdyz server neni store.py, nebo kdyz chce clovek
   videt konkretni historicky rez. */
const PARAMS = new URLSearchParams(location.search);
const LEGACY_FILE = PARAMS.get('file');
let VIEW = PARAMS.get('view') || 'prefixes';
let SOURCE_LABEL = LEGACY_FILE || '/api/query';

// ?prefix= ma prednost pred zapamatovanou hodnotou, aby se dal odkaz poslat
const urlPrefix = PARAMS.get('prefix');
if (urlPrefix !== null) prefixIn.value = urlPrefix;
else { try { prefixIn.value = localStorage.getItem(PREFIX_KEY) || ''; } catch {} }
setupLimitControl();

function queryUrl() {
  const p = new URLSearchParams({ view: VIEW, top: limitSel.value || '200' });
  if (prefixIn.value) p.set('prefix', prefixIn.value);
  return '/api/query?' + p.toString();
}

function showError(what, err, hint) {
  errEl.style.display = 'block';
  errEl.textContent = `Nepodařilo se načíst ${what}: ${err.message}` + (hint ? '  — ' + hint : '');
}

let inflight = 0;
async function load() {
  const seq = ++inflight;
  const url = LEGACY_FILE || queryUrl();
  shownEl.textContent = 'načítám…';
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const db = await r.json();
    if (seq !== inflight) return;      // rychlejsi psani v filtru nez odpovedi
    errEl.style.display = 'none';
    // Odkaz ma byt sdilitelny, ale prepinani pohledu nema pretezovat stranku.
    if (!LEGACY_FILE) {
      const p = new URLSearchParams({ view: VIEW });
      if (prefixIn.value) p.set('prefix', prefixIn.value);
      history.replaceState(null, '', '?' + p.toString());
    }
    render(db);
  } catch (err) {
    if (seq !== inflight) return;
    if (LEGACY_FILE) {
      showError(LEGACY_FILE, err,
        'vygeneruj ho: py export_dijkstra_top.py <data>.json --top 500 -o ' + LEGACY_FILE);
    } else {
      showError('/api/query', err,
        'bezi server.py? spust: py server.py   (staticky server API nema — pak jde jen ?file=…)');
    }
    shownEl.textContent = '';
  }
}

load();
</script>
