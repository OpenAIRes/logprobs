<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logprobs — lists</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app.css">
<style>
  /* Palette, buttons and form controls live in app.css so every page reads as
     one program. Only this page's own layout stays here. */

  header { margin-bottom: 1.5rem; }
  h1 { margin: 0 0 .35rem; font-size: 1.5rem; letter-spacing: -.01em; font-weight: 620; }
  .sub { color: var(--ink-dim); font-size: .875rem; }

  .meta {
    display: flex; flex-wrap: wrap; gap: .4rem 1.5rem;
    margin-top: 1rem; padding: .7rem .9rem;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow);
    font-size: .8125rem;
  }
  .meta div { color: var(--ink-dim); }
  .meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0 .6rem; flex-wrap: wrap; }
  .shown { font-size: .78125rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .shown.filtered { color: var(--accent); font-weight: 600; }

  /* --- compact one-line-per-entry table --- */
  .table {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 9px; box-shadow: var(--shadow); overflow: hidden;
  }
  .thead, .row {
    display: grid;
    grid-template-columns: 3rem minmax(0,1fr) 3.5rem 6rem 6rem 5.5rem;
    gap: .85rem; align-items: center;
    padding: .3rem .9rem;
  }
  /* only when the source data is a sweep and carries provenance */
  .has-sweep .thead, .has-sweep .row {
    grid-template-columns: 3rem minmax(0,1fr) 3.5rem 6rem 6rem 5.5rem 10.5rem;
  }
  .c-sweep { font-size: .71875rem; color: var(--ink-faint);
    font-family: ui-monospace, Menlo, monospace; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .c-sweep .pos { color: var(--accent); font-weight: 600; }
  .c-sweep .onpath { color: var(--good); }
  .c-sweep .stopped { color: var(--bad); font-weight: 600; }
  .c-sweep .ncalls { color: var(--mid); }   /* same string from several calls */
  /* What decided the end of this string. Without it a prefix and a finished
     string look alike in the table, and their Σ logprob is not the same kind of
     quantity -- a prefix's can only get worse. */
  .c-sweep .end { font-weight: 600; }
  .c-sweep .end.stop { color: var(--good); }
  .c-sweep .end.length { color: var(--mid); }
  .c-sweep .end.open { color: var(--ink-faint); font-weight: 400; }
  .c-sweep .cont { color: var(--accent); padding-left: .15rem; }
  /* The continuation is shown but is NOT what the row was ranked by, so it reads
     as a different kind of text rather than more of the same. */
  .tok.ext { opacity: .62; }
  .extmark { color: var(--accent); font-weight: 600; padding: 0 .1rem; }
  .more { color: var(--ink-faint); font-size: .71875rem; }
  .subnum { display: block; font-size: .6875rem; color: var(--ink-faint);
    font-family: ui-monospace, Menlo, monospace; }
  .dup { color: var(--ink-faint); font-size: .71875rem; }
  .warn { color: var(--bad); }
  .thead {
    position: sticky; top: 0; z-index: 5;
    background: var(--card); border-bottom: 1px solid var(--line);
    font-size: .6875rem; text-transform: uppercase; letter-spacing: .045em;
    color: var(--ink-faint); font-weight: 600; padding-top: .5rem; padding-bottom: .5rem;
  }
  .thead .num, .row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .thead .key { color: var(--accent); }

  .row { border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--hover); }
  .row.open { background: var(--hover); }

  .rank { font: 600 .8125rem/1 ui-monospace, Menlo, monospace; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; }
  .row.open .rank { color: var(--accent); }

  .text {
    font: 13px/1.65 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .row.open .text { white-space: normal; overflow: visible; word-break: break-word; padding: .25rem 0; }

  .tok {
    display: inline-block; padding: .02em .24em; margin: 0 1px 1px 0;
    border-radius: 3px; border-bottom: 2px solid transparent;
  }
  .row.open .tok { cursor: pointer; }
  .row.open .tok:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
  .tok.sel { background: var(--accent) !important; color: var(--card); }
  .tok .ctrl { color: var(--ink-faint); font-size: .85em; }
  .tok.sel .ctrl { color: var(--card); opacity: .75; }
  .tok.alt { border-bottom-color: var(--mid); border-bottom-style: dotted; }

  .cell { font-size: .78125rem; color: var(--ink-dim); font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Menlo, monospace; }
  .cell.key { color: var(--accent); font-weight: 600; }

  .detail {
    grid-column: 1 / -1;
    margin: .1rem 0 .5rem; padding: .65rem .8rem;
    background: var(--chip); border-radius: 7px; font-size: .8125rem;
    cursor: default;
  }
  .detail.hide { display: none; }
  .detail .dh { font-weight: 600; margin-bottom: .4rem; font-family: ui-monospace, Menlo, monospace; }
  .detail .dh .src { font-family: system-ui, sans-serif; font-weight: 500; font-size: .8125rem;
    color: var(--ink-dim); margin-left: .5rem; }
  .detail table { border-collapse: collapse; max-width: 420px; }
  .detail td { padding: .1rem .6rem .1rem 0; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Menlo, monospace; font-size: .78125rem; }
  .detail td.num { color: var(--ink-dim); text-align: right; }
  .detail tr.this td { color: var(--accent); font-weight: 600; }
  .detail .none, .detail .hint { color: var(--ink-faint); font-style: italic; }

  #err { color: var(--bad); padding: 1rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; }

  /* --- alternatives grid and walk --- */
  #special { background: var(--card); border: 1px solid var(--line);
    border-radius: 9px; box-shadow: var(--shadow); overflow: hidden; }
  .prow { display: grid; grid-template-columns: 2.5rem 7rem minmax(0,1fr);
    gap: .7rem; align-items: baseline; padding: .35rem .9rem;
    border-bottom: 1px solid var(--line-soft); }
  .prow:last-child { border-bottom: none; }
  .prow .pi { font: 600 .75rem/1.6 ui-monospace, Menlo, monospace; color: var(--ink-faint); }
  .prow .base { font: 13px/1.6 ui-monospace, Menlo, monospace; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alts { display: flex; flex-wrap: wrap; gap: .25rem; min-width: 0; }
  .alt-chip { font: 12px/1.5 ui-monospace, Menlo, monospace; padding: .05em .35em;
    border-radius: 3px; background: var(--chip); border: 1px solid transparent;
    cursor: default; white-space: nowrap; }
  /* The greedy alternative is the token the model actually chose. It has to be
     distinguishable from the other 19, or the grid does not say what the
     deviations deviate from. */
  .alt-chip.greedy { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .alt-chip .lp { color: var(--ink-faint); margin-left: .3em; }

  .wrow { display: grid; grid-template-columns: 2.5rem 3rem 9rem 5rem 3.5rem 6rem;
    gap: .7rem; align-items: baseline; padding: .35rem .9rem .1rem;
    font-size: .78125rem; color: var(--ink-dim);
    font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .wtext { padding: 0 .9rem .4rem 5.9rem; border-bottom: 1px solid var(--line-soft);
    font: 13px/1.6 ui-monospace, Menlo, monospace; color: var(--ink);
    white-space: pre-wrap; word-break: break-word; }
  .wrow .cost { color: var(--accent); font-weight: 600; }
  .needs { padding: .6rem .9rem; background: rgba(176,125,43,.10); color: var(--mid);
    font-size: .78125rem; line-height: 1.5; }
  .needs b { font-family: ui-monospace, Menlo, monospace; }

  .extend { margin-top: 1rem; }
  .extend p { margin: 0 0 .7rem; font-size: .875rem; color: var(--ink-dim); line-height: 1.55; }
  .extend p b { color: var(--ink); font-weight: 600; }
  .extend .go { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .extend .cmd { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--ink);
    background: var(--chip); border-radius: 6px; padding: .35rem .5rem; word-break: break-all; }
  .extend .price { font-size: .78125rem; color: var(--mid); }

  @media (max-width: 720px) {
    .thead, .row { grid-template-columns: 2.5rem minmax(0,1fr) 5.5rem; }
    .thead .c-mean, .row .c-mean, .thead .c-ppl, .row .c-ppl,
    .thead .c-n, .row .c-n { display: none; }
  }
</style>
</head>
<body>
<nav class="appnav">
  <a href="/">Start</a><span class="sep">|</span>
  <a href="/help.html">Help</a>
  <span class="right" id="navStore">…</span>
</nav>
<!-- One settings bar for every page, rendered by bar.js. This page's own strip
     below keeps only what is a live filter over already-loaded rows. -->
<div id="settingsbar"></div>
<!-- Before this page's own script, not after: the page reads its settings from
     window.settingsBar, and a `const` in bar.js is not visible until it runs. -->
<script src="/bar.js"></script>
<script>
/* The strip says which page you are on and whether the store answers. Several
   views behave differently when it does not, and noticing that from an empty
   table is worse than being told. */
fetch('/api/stats', { cache: 'no-store' })
  .then(r => r.json())
  .then(s => { document.getElementById('navStore').textContent = s.records + ' records'; })
  .catch(() => { document.getElementById('navStore').textContent = 'store not answering'; });
</script>

<div class="wrap">
  <header>
    <h1 id="title">Logprobs</h1>
    <div class="sub">
      <span id="blurb"></span>
      Data: <code id="srcName">/api/query</code>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  </div>
  </div>

  <div class="table" id="table" hidden>
    <div class="thead">
      <div>#</div>
      <div>string</div>
      <div class="num c-n">length</div>
      <div class="num key">Σ logprob</div>
      <div class="num c-mean">mean</div>
      <div class="num c-ppl">ppl</div>
      <div class="c-sweep" id="thSweep" hidden>end · deviation</div>
    </div>
    <div id="list"></div>
  </div>
  <!-- The grid and the walk have a different shape from a ranking, so they carry
       their own container instead of being forced into the six-column grid. -->
  <div id="special" hidden></div>

  <!-- Every view can be pushed further, and "further" means something different
       in each. Nothing here spends on its own: a browser-side extension opens the
       builder, and a CLI one shows the exact command with its call count. -->
  <section class="panel extend" id="extend" hidden>
    <h2>Extend this view</h2>
    <p id="extendWhat"></p>
    <div class="go" id="extendGo"></div>
  </section>

  <div id="err" style="display:none"></div>
</div>

<script>
const listEl  = document.getElementById('list');
const tableEl = document.getElementById('table');
const metaEl  = document.getElementById('meta');
const errEl   = document.getElementById('err');
/* The settings all live in the bar, which persists them and puts them in the
   address. This page reads them and renders; it owns no control of its own, so
   there is nothing left that can disagree with what the bar says. */
const BAR = window.settingsBar || { state: {} };
const S = BAR.state;
const listOf = v => (v ? String(v).split(',') : []);
/* Deviation cost is the greedy criterion and only exists there; a ranking has no
   base to measure against, so it can never be left on `cost`. */
const effectiveSort = () => {
  const want = S.sort || (S.view === 'greedy' ? 'cost' : 'sum');
  return (want === 'cost' && S.view !== 'greedy') ? 'sum' : want;
};



/* Filtr "zacina na": porovnava se surovy text vcetne bilych znaku, ne to, co
   je videt v tabulce (tam se \n zobrazuje jako ⏎). Vetsina retezcu zacina
   newline, takze hledani "I have" by pri striktnim prefixu nenaslo nic —
   pocatecni bile znaky se proto pri porovnani ignoruji. */
function matchesPrefix(text, q) {
  if (!q) return true;
  return text.startsWith(q) || text.replace(/^\s+/, '').startsWith(q);
}

function currentPrefix() { return S.prefix || ''; }
/* The count lives in the bar, which is the only counter now: this page's own
   strip said "200 of 363 results · 451 unreachable · 8492 records in store",
   all of which the meta block below already states, and the first half of which
   the bar states too. */
const shownEl = document.getElementById('sInfo') || document.createElement('span');
// This page reports its own count into the bar's slot, so the bar stops writing
// there -- otherwise both would, and whichever fetch landed last would win.
if (window.settingsBar && window.settingsBar.suppressInfo) window.settingsBar.suppressInfo();


let DB = null;

// Render control characters visibly — otherwise a token that is purely "\n" or
// " " renders as nothing at all and the row looks empty.
function escapeToken(t) {
  const out = [];
  for (const ch of t) {
    if (ch === '\n') out.push('<span class="ctrl">⏎</span>');
    else if (ch === '\t') out.push('<span class="ctrl">⇥</span>');
    else if (ch === ' ') out.push('<span class="ctrl">␣</span>');
    else if (ch === '\ufeff') out.push('<span class="ctrl">[BOM]</span>');
    else out.push(ch.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
  }
  return out.join('');
}
function plain(t) {
  return t.replace(/\n/g,'\\n').replace(/\t/g,'\\t').replace(/ /g,'␣').replace(/\ufeff/g,'[BOM]');
}

// Colour a token by its probability: near-1 reads as "confident", near-0 as
// "the model was genuinely choosing". Alpha-only so it works in both themes.
// Shared with the token browser, from bar.js: the same token used to be plain
// there and coloured here.
const tokColor = window.tokColor;

function fmt(x, d = 4) { return Number(x).toFixed(d); }

/* The alternative's text goes into title="", so quotes and ampersands suffice;
   plain() has already made whitespace visible, so no raw newline gets here. */
function escapeAttr(t) {
  return plain(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// Named (rather than inline in the click handler) so the detail rendering can be
// exercised directly, without a real mouse event.
function toggleTokenDetail(row, entry, index) {
  const detailEl = row.querySelector('.detail');
  const el = row.querySelector(`.tok[data-i="${index}"]`);
  const t = entry.tokens[index];
  if (!el || !t) return;

  const wasSel = el.classList.contains('sel');
  row.querySelectorAll('.tok.sel').forEach(s => s.classList.remove('sel'));
  if (wasSel) { renderRowHint(detailEl); return; }
  el.classList.add('sel');

  const alts = t.alternatives || [];
  const rows = alts.length
    ? `<table>${alts.map(a => `
        <tr class="${a.token === t.token ? 'this' : ''}">
          <td>${plain(a.token)}</td>
          <td class="num">${fmt(a.logprob, 3)}</td>
          <td class="num">${fmt(Math.exp(a.logprob), 5)}</td>
        </tr>`).join('')}</table>`
    : `<div class="none">No alternatives recorded at this position.</div>`;

  detailEl.innerHTML = `
    <div class="dh">„${plain(t.token)}"
      <span class="src">logP ${fmt(t.logprob)} · p ${fmt(Math.exp(t.logprob), 5)}
      · cumulative ${fmt(t.cumulative)} · from ${t.source === 'alt' ? 'top_logprobs (alternative)' : 'a generated token'}</span>
    </div>${rows}`;
  detailEl.classList.remove('hide');
}

function renderRowHint(detailEl) {
  detailEl.innerHTML = `<div class="hint">Click a token above to see its logprob and the alternatives the model weighed at that position.</div>`;
  detailEl.classList.remove('hide');
}

/* The provenance column. A sweep entry says which alternative it took; a greedy
   sibling says the same thing plus what the departure cost, which is the number
   the whole view is ordered by, so it has to be on the row. */
/* What ended this string, shown on every row. It is not decoration: Σ logprob
   over an 'open' prefix is a partial sum that can only get worse, over a 'stop'
   string it is final, so two rows are only comparable when this matches. */
const END_TITLE = {
  stop: 'finished — the model emitted EOS, so Σ logprob is final. '
      + 'The only ending that is not a prefix.',
  length: 'a prefix — max_tokens ran out; the model had not finished. Σ is a partial sum.',
  open: 'a prefix — nothing recorded ends here; the trie continues below and the '
      + 'enumeration stopped.',
};
/* A row that the database continues past. Not the same as how it ended: 494
   length-ended paths were later taken as another call's prompt and carried on. */
function contMark(e) {
  if (e.node_kind !== 'continues') return '';
  return '<span class="cont" title="the database holds a continuation of this string — '
    + 'tick only “dead end” to exclude rows like this">⋯</span>';
}

function endBadge(e) {
  // With the row extended, the ending shown is the extension's -- an 'open'
  // prefix that was followed to a record end is no longer open.
  const end = (e.extension && e.extension.added_n ? e.extension.end : null)
    || e.end || e.finish_reason;
  if (!end) return '';
  return `<span class="end ${end}" title="${END_TITLE[end] || ''}">${end}</span>`;
}

/* The provenance column. A sweep entry says which alternative it took; a greedy
   sibling says the same thing plus what the departure cost, which is the number
   the whole view is ordered by, so it has to be on the row. */
function devCell(e) {
  const badge = endBadge(e);
  let rest = '';
  if (e.deviation !== undefined) {
    if (!e.deviation) {
      rest = '<span class="onpath">greedy</span>';
    } else {
      const d = e.deviation;
      rest = `<span class="pos">${d.position}</span> `
        + `${plain(d.original)}→${plain(d.alternative)} `
        + `<span class="ncalls">+${fmt(e.cost, 3)}</span>`;
    }
  } else if (e.sweep) {
    // The finish_reason used to be repeated here; the badge above says it now.
    rest = `${e.sweep.is_greedy
      ? '<span class="onpath">on-path</span>'
      : `<span class="pos">${e.sweep.position}</span> ${plain(e.sweep.alternative)}`}${
      e.n_calls > 1 ? ` <span class="ncalls">×${e.n_calls}</span>` : ''}`;
  }
  const mark = contMark(e);
  if (!badge && !rest && !mark) return '';
  return `<div class="c-sweep">${badge}${mark}${(badge || mark) && rest ? ' ' : ''}${rest}</div>`;
}

function buildRow(e) {
  const row = document.createElement('div');
  row.className = 'row';

  /* The colour goes into a custom property, not straight into `background`. The
     bar's `colour` box then switches it with one class on <body>, with nothing to
     re-render -- an inline background could not be turned off that way. */
  const tokSpan = (t, i, extra) =>
    `<span class="tok${t.source === 'alt' ? ' alt' : ''}${extra}" data-i="${i}"
           style="--tc:${tokColor(t.logprob)}"
           title="${plain(t.token)}  logP=${fmt(t.logprob)}">${escapeToken(t.token)}</span>`;

  const x = e.extension;
  /* The continuation is appended to the row but stays visibly separate: it is not
     what the row was ranked by, and over the default top 200 ranking by the
     extended sum would reorder 11,325 of 19,900 pairs. */
  const toks = e.tokens.map((t, i) => tokSpan(t, i, '')).join('')
    + (x && x.added_n
        ? '<span class="extmark" title="everything after this point is the continuation, '
          + 'not part of what was ranked">›</span>'
          + x.tokens.map((t, i) => tokSpan(t, e.tokens.length + i, ' ext')).join('')
          + (x.detail_truncated
              ? `<span class="more"> …${x.added_n - x.tokens.length} more</span>` : '')
        : '');

  row.innerHTML = `
    <div class="rank">${e.rank}${x && x.same_as_rank
      ? `<span class="dup" title="an earlier row already extends to this same string">=${x.same_as_rank}</span>` : ''}</div>
    <div class="text">${toks}</div>
    <div class="cell num c-n">${e.n}${x && x.added_n ? `<span class="subnum">+${x.added_n}</span>` : ''}</div>
    <div class="cell num key">${fmt(e.sum_logprob)}${x && x.added_n
      ? `<span class="subnum" title="the whole string; the ranking uses the value above">→ ${fmt(x.sum_logprob, 2)}</span>` : ''}</div>
    <div class="cell num c-mean">${fmt(e.mean_logprob)}</div>
    <div class="cell num c-ppl">${fmt(e.perplexity, 2)}</div>
    ${devCell(e)}
    <div class="detail hide"></div>`;

  const detailEl = row.querySelector('.detail');

  // Click the row to expand it (full text + per-token inspection); click a token
  // inside an expanded row to inspect that position.
  row.addEventListener('click', ev => {
    const tokEl = ev.target.closest('.tok');
    if (tokEl && row.classList.contains('open')) {
      toggleTokenDetail(row, e, +tokEl.dataset.i);
      return;
    }
    if (ev.target.closest('.detail')) return;   // don't collapse when using the panel
    const opening = !row.classList.contains('open');
    row.classList.toggle('open', opening);
    if (opening) renderRowHint(detailEl);
    else {
      detailEl.classList.add('hide');
      row.querySelectorAll('.tok.sel').forEach(s => s.classList.remove('sel'));
    }
  });

  return row;
}

function renderRows() {
  const q = currentPrefix();
  // The store already filters before the cap (which is why a separate file for
  // "I have" had to exist), so this is only instant feedback before it answers.
  const matching = q ? DB.entries.filter(e => matchesPrefix(e.text, q)) : DB.entries;
  // In ?file= mode nothing filters or caps server-side, so the cap applies here.
  const slice = LEGACY_FILE
    ? matching.slice(0, Number(S.top) || matching.length)
    : matching;


  listEl.textContent = '';
  if (!slice.length) {
    listEl.innerHTML = q
      ? `<div class="empty">No string starts with <code>${plain(q)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code>.</div>`
      : '<div class="empty">Nothing here yet.</div>';
    shownEl.textContent = '0 results';
    shownEl.classList.toggle('filtered', !!q);
    tableEl.hidden = false;
    return;
  }

  const frag = document.createDocumentFragment();
  slice.forEach(e => frag.appendChild(buildRow(e)));
  listEl.appendChild(frag);

  const anySweep = slice.some(e => e.sweep || e.deviation !== undefined
                                 || e.end || e.finish_reason);
  tableEl.classList.toggle('has-sweep', anySweep);
  document.getElementById('thSweep').hidden = !anySweep;

  /* Short on purpose: it shares the bar with the colour key, and a long line
     wrapped the bar onto a second row. `records in store` and `unreachable` are
     both in the meta block below, so this keeps only what the bar is for --
     how much of the match is on screen. A prefixes view shows a sliver
     (50 of 176,649), and without the second number it reads as the whole answer. */
  const avail = DB.available != null && DB.available > slice.length
    ? ` of ${DB.available.toLocaleString('en-US')}` : '';
  shownEl.textContent = `${slice.length}${avail} results`;
  shownEl.classList.toggle('filtered', !!q);
  tableEl.hidden = false;
}


const el = id => document.getElementById(id);
/* greedy is a ranked list too -- of the greedy path and its one-token siblings --
   so it shares the table, the results cap and the sort control. */
const RANKED = v => v === 'prefixes' || v === 'completions' || v === 'greedy';

/* The meta block used to derive its label from db.view, which reads 'prefixes'
   for anything that is not completions -- and /api/greedy_alternatives answers
   with view 'greedy_alternatives', so the greedy list announced itself as a
   best-first prefix search. VIEW is what was asked for, so VIEW names it. */
const VIEW_LABEL = {
  completions: 'completions (prompt + generated)',
  prefixes: 'prefixes — best-first',
  greedy: 'greedy path + one-token siblings',
};
const specialEl = document.getElementById('special');

/* The heading carries a quarter of the explanation, so it follows the view --
   "Prefixes by cumulative logprob" above an alternatives grid would simply lie. */
const BLURBS = {
  greedy: ['Greedy path and its next best',
    'Rank 1 is what temperature 0 produces. Every other row is that path with ONE token '
    + 'changed, then greedy again — so "second best by the greedy criterion" is the cheapest '
    + 'departure. Ordering by cost and by resulting Σ logprob give very different answers.'],
  completions: ['Completions by cumulative logprob',
    'One entry per recorded call: the whole string it produced, prompt included. The strings '
    + 'are not all the same length (the prompt grows with the deviation position), so a sum '
    + 'favours the shorter ones — mean logprob is in the next column.'],
  prefixes: ['Prefixes by cumulative logprob',
    'Best-first (uniform-cost / Dijkstra) search over the token trie. Every logprob is ≤ 0, so '
    + 'extending a prefix can never raise its sum — which is what makes the order provably correct.'],
  sweep: ['Alternatives grid',
    'For each position of one base completion, all 20 alternatives the model offered there. '
    + 'The framed one is what it actually chose; the rest are the deviations we paid to see.'],
  walk: ['Cheapest-deviation walk',
    'Each step takes the single-token change costing the fewest nats and regenerates the '
    + 'continuation. Computed from stored records only — it stops where a call would be needed.'],
};

function applyBlurb() {
  const [title, blurb] = BLURBS[VIEW] || BLURBS.prefixes;
  document.getElementById('title').textContent = title;
  document.getElementById('blurb').textContent = blurb;
}

/* Nothing here toggles a control any more -- the bar has them all. The blurb
   still follows the view, which is the one thing this page owns. */
function applyViewControls() { applyBlurb(); }

function renderSweep(db) {
  tableEl.hidden = true;
  specialEl.hidden = false;
  metaEl.innerHTML = `
    <div>view: <b>alternatives grid</b></div>
    <div>base: <b>${db.base_found ? 'found' : 'MISSING'}</b></div>
    <div>tokens in base: <b>${db.base_tokens.length}</b></div>
    <div>positions: <b>${db.positions.length}</b></div>
    <div>calls in grid: <b>${db.cells}</b></div>`;

  if (!db.positions.length) {
    specialEl.innerHTML = '<div class="empty">No deviations recorded for this base.</div>';
    shownEl.textContent = '';
    return;
  }

  specialEl.innerHTML = db.positions.map(p => {
    const chips = p.alternatives.map(a => {
      const lp = a.alternative_logprob;
      return `<span class="alt-chip${a.is_greedy ? ' greedy' : ''}" title="${
        escapeAttr((a.text || '').slice(0, 160))}">${plain(a.alternative)
        }<span class="lp">${lp == null ? '' : fmt(lp, 2)}</span></span>`;
    }).join('');
    return `<div class="prow">
      <div class="pi">${p.position}</div>
      <div class="base">${plain(db.base_tokens[p.position] ?? '')}</div>
      <div class="alts">${chips}</div>
    </div>`;
  }).join('');
  shownEl.textContent = `${db.positions.length} positions · ${db.cells} calls`;
}

function renderWalk(db) {
  tableEl.hidden = true;
  specialEl.hidden = false;
  metaEl.innerHTML = `
    <div>view: <b>cheapest-deviation walk</b></div>
    <div>steps from store: <b>${db.steps.length}</b></div>
    <div>base Σ logprob: <b>${db.base ? fmt(db.base.sum) : '—'}</b></div>
    <div>tokens after a deviation: <b>${db.extend}</b></div>
    <div>positions: <b>${db.forward_only ? 'forward only' : 'unrestricted'}</b></div>`;

  const rows = [`<div class="wrow"><div>0</div><div>—</div><div>base</div><div>—</div>
      <div>${db.base.n}</div><div>${fmt(db.base.sum)}</div></div>
    <div class="wtext">${plain(db.base.text)}</div>`];

  for (const s of db.steps) {
    rows.push(`<div class="wrow">
      <div>${s.step}</div><div>${s.position}</div>
      <div>${plain(s.original)} → ${plain(s.alternative)}</div>
      <div class="cost">${fmt(s.cost)}</div>
      <div>${s.n}</div><div>${fmt(s.sum)}</div>
    </div><div class="wtext">${plain(s.text)}</div>`);
  }

  // Where the walk would continue only past a paid call. Said out loud, so that
  // "8 steps" is not read as "this is the end".
  if (db.needs_call) {
    const nc = db.needs_call;
    rows.push(`<div class="needs">The next step would need <b>1 API call</b>:
      position ${nc.position}, <b>${plain(nc.original)} → ${plain(nc.alternative)}</b>,
      deviation cost <b>${fmt(nc.cost)}</b>. That prompt is not in the store, so the walk
      stops here.</div>`);
  } else if (!db.steps.length) {
    rows.push('<div class="empty">No step can be taken from the stored records.</div>');
  }

  specialEl.innerHTML = rows.join('');
  shownEl.textContent = `${db.steps.length} steps`
    + (db.needs_call ? ' · the next one needs a call' : '');
}

/* Roughly $0.000058 per call, measured over the ~8100 calls already logged. */
const PER_CALL_USD = 0.000058;
const price = n => '~$' + (n * PER_CALL_USD).toFixed(4) + ' for ' + n + ' calls';

function renderExtend(db) {
  const box = el('extend'), what = el('extendWhat'), go = el('extendGo');
  box.hidden = false;
  go.innerHTML = '';

  const button = (label, href, primary) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (primary) b.className = 'primary';
    b.addEventListener('click', () => { location.href = href; });
    go.appendChild(b);
  };
  const command = (cmd, calls) => {
    const c = document.createElement('span'); c.className = 'cmd'; c.textContent = cmd;
    const p = document.createElement('span'); p.className = 'price'; p.textContent = price(calls);
    go.append(c, p);
  };

  if (RANKED(VIEW)) {
    what.innerHTML = 'Extending a ranking means expanding <b>the best prefix not yet tried</b>, '
      + 'which is exactly what the builder does — so the database grows in the same order this '
      + 'list is read in. It also runs a simulation mode with no API calls at all, and it can '
      + 'prove a top-K without exploring the rest of the frontier.';
    button('Open builder', '/builder.html', true);
    return;
  }

  if (VIEW === 'sweep') {
    const done = db.cells || 0;
    const full = (db.base_tokens || []).length * 20;
    const complete = full > 0 && done >= full;
    // A full grid must not be offered for sweeping again: it would be 400 paid
    // calls for records already in the store.
    what.innerHTML = complete
      ? `This grid is <b>complete</b>: all ${done} cells are recorded, so there is nothing left `
        + `to pay for here. To go further, sweep a <b>different base</b> — pick any string from `
        + `the completions list and use its id. A sweep is 20 × 20 calls and runs on the command `
        + `line, because it wants a resumable ledger.`
      : `Extending a grid means <b>sweeping a base</b>: following every alternative at every `
        + `position. This one holds <b>${done}</b> of ${full || '20 × 20'} cells. A sweep is a `
        + `command-line run, because it is hundreds of calls and wants a resumable ledger — the `
        + `browser is the wrong place for that.`;
    command('py sweep_alternatives.py --base-id ' + (complete ? '<other-id>' : (db.base_id || '<id>'))
            + ' --out sweep_next.jsonl --json-out sweep_next.json',
            complete ? (full || 400) : (full - done) || 400);
    return;
  }

  if (VIEW === 'walk') {
    const nc = db.needs_call;
    const want = Number(S.steps) || 20;
    const missing = Math.max(0, want - (db.steps || []).length);
    what.innerHTML = nc
      ? `The walk stopped because one prompt is missing. Extending it means <b>paying for that `
        + `regeneration</b> — one call per step, so ${missing} more step${missing === 1 ? '' : 's'} `
        + `is ${missing} call${missing === 1 ? '' : 's'}. The cheapest deviation is free to work `
        + `out; only following it costs anything.`
      : `Every requested step came out of the store, so there is nothing to pay for. Ask for more `
        + `steps to push further.`;
    if (nc) {
      button('Open that prompt in the token browser',
             '/logprobs.html?prompt=' + encodeURIComponent(nc.prompt));
      command('py sweep_alternatives.py --prompt-file next_prompt.txt', missing || 1);
    }
    return;
  }

  box.hidden = true;
}

function render(db) {
  DB = db;
  window.__db = db;   // handy for poking at the data from the console
  /* The route the data on screen actually came from. It used to be set once at
     startup, so every view claimed /api/query -- greedy and walk and the grid
     included, none of which read that route. A provenance label that names the
     wrong source is worse than none. */
  document.getElementById('srcName').textContent =
    LEGACY_FILE || db.__route || '/api/query';
  renderExtend(db);

  if (VIEW === 'sweep') return renderSweep(db);
  if (VIEW === 'walk')  return renderWalk(db);
  specialEl.hidden = true;

  metaEl.innerHTML = `
    <div>ranked by: <b>${db.ranking || 'Σ logprob, descending'}</b></div>
    ${VIEW === 'greedy' ? `<div>departures ranked: <b>${db.departures_ranked}</b></div>
      <div>departures needing a call: <b>${db.departures_without_record}</b></div>` : ''}
    <div>view: <b>${VIEW_LABEL[VIEW] || VIEW}</b></div>
    ${db.end_counts ? `<div>scope: <b>${db.ends ? db.ends.join(' + ') : 'every ending'}</b>
      — ${Object.entries(db.end_counts).map(([k, v]) => `${v}&nbsp;${k}`).join(', ') || 'nothing'}</div>` : ''}
    ${db.truncated_by_budget ? `<div class="warn">the trie search hit its ${db.search_pops}-step
      budget before filling the list, so more matching strings may exist below the last row</div>` : ''}
    ${db.available != null ? `<div>shown: <b>${db.count}</b> of <b>${db.available}</b>${
      db.trie_total ? ` matching · ${db.trie_total} prefixes in the trie, ${db.unreachable}
      unreachable — ${db.unreachable_unscored} of them because a path may not pass a token
      with no known logprob${db.unreachable > db.unreachable_unscored
        ? `, the other ${db.unreachable - db.unreachable_unscored} because they hold a
           recovered token and this setting excludes those` : ''}` : ''}</div>` : ''}
    ${db.chosen_only_note ? `<div>tokens: <b>${db.chosen_only_note}</b></div>` : ''}
    ${db.node_counts ? `<div>continuation: <b>${db.nodes ? db.nodes.join(' + ') : 'either'}</b>
      — ${Object.entries(db.node_counts).map(([k, v]) => `${v}&nbsp;${k}`).join(', ') || 'nothing'}</div>` : ''}
    ${db.extend ? `<div>rows extended: <b>${db.distinct_extended}</b> distinct strings from
      ${db.entries.length} rows — the ranking is still over the prefix, and extending would
      reorder it</div>` : ''}
    <div>records in store: <b>${db.source_records}</b></div>
    <div>results computed: <b>${db.entries.length}</b></div>
    <div>sources: <b>${db.generated_from}</b></div>
    <div>model filter: <b>${db.model_filter || 'none'}</b></div>
    ${db.prefix_filter ? `<div>starts with: <b>"${db.prefix_filter}"</b></div>` : ''}
    <div>chosen tokens only: <b>${db.chosen_only ? 'yes' : 'no'}</b></div>`;

  renderRows();
}

/* Where the data comes from.

   This used to be a frozen export: dijkstra_top.json had been built from 391
   records while 8492 existed, and contained no sweep data at all. The same query
   now goes to the store, which holds every record, so a ranking cannot go stale.

   ?file=… still works, for a plain static server or to look at one historical
   slice deliberately. */
const PARAMS = new URLSearchParams(location.search);
const LEGACY_FILE = PARAMS.get('file');
let VIEW = PARAMS.get('view') || 'prefixes';


/* Built entirely from the bar's state, so there is one place a setting can come
   from. Everything ticked means the same as no filter, and leaving the parameter
   off then keeps the store's fast path -- and old links -- as they were. */
function queryUrl() {
  if (VIEW === 'sweep') {
    const p = new URLSearchParams();
    if (S.base_id) p.set('base_id', S.base_id);
    return '/api/sweep?' + p.toString();
  }
  if (VIEW === 'walk') {
    return '/api/walk?' + new URLSearchParams({
      steps: String(S.steps || 20),
      forward_only: S.forward_only ? '1' : '0',
      ...(S.base_id ? { base_id: S.base_id } : {}),
    }).toString();
  }
  const p = new URLSearchParams({ top: String(S.top || (VIEW === 'greedy' ? 20 : 200)) });
  if (S.ends) p.set('ends', S.ends);
  if (S.nodes) p.set('nodes', S.nodes);
  if (S.extend) p.set('extend', '1');
  if (VIEW === 'greedy') {
    p.set('sort', effectiveSort());
    if (S.prompt) p.set('prompt', S.prompt);
    return '/api/greedy_alternatives?' + p.toString();
  }
  p.set('view', VIEW);
  if (S.prefix) p.set('prefix', S.prefix);
  if (VIEW === 'completions') p.set('sort', effectiveSort());
  if (VIEW === 'prefixes' && S.chosen_only) p.set('chosen_only', '1');
  return '/api/query?' + p.toString();
}

function showError(what, err, hint) {
  errEl.style.display = 'block';
  errEl.textContent = `Could not load ${what}: ${err.message}` + (hint ? '  — ' + hint : '');
}

let inflight = 0;
async function load() {
  const seq = ++inflight;
  const url = LEGACY_FILE || queryUrl();
  shownEl.textContent = 'loading…';
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const db = await r.json();
    if (seq !== inflight) return;      // typing faster than the store answers
    // The route that actually produced THIS payload. Recomputing it at render
    // time read the current VIEW instead, so a response arriving after a switch
    // was labelled with the view the user had just moved to.
    db.__route = url.split('?')[0];
    errEl.style.display = 'none';
    /* No replaceState here any more. The bar puts every setting in the address
       before it navigates, so rewriting the address from this page's own reading
       of the state was just a second chance for the two to disagree -- and they
       did: it dropped `top` and resurrected a stale `sort`. */
    render(db);
  } catch (err) {
    if (seq !== inflight) return;
    if (LEGACY_FILE) {
      showError(LEGACY_FILE, err,
        'generate it: py export_dijkstra_top.py <data>.json --top 500 -o ' + LEGACY_FILE);
    } else {
      showError('/api/query', err,
        'is server.py running? start it: py server.py   (a plain static server has no API, '
        + 'and then only ?file=… works)');
    }
    shownEl.textContent = '';
  }
}

(async () => {
  applyViewControls();
  // The grid and the walk need a base_id the bar resolves with a fetch; without
  // waiting, the first query goes out with none and /api/sweep answers 400.
  await (BAR.ready || Promise.resolve());
  load();
})();
</script>
</body>
</html>
