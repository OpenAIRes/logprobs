<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logprobs — start</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app.css">
<style>
  /* Look comes from app.css; this is only the start page's layout. */
  header { margin: .5rem 0 1.4rem; }
  h1 { margin: 0 0 .4rem; font-size: 1.6rem; letter-spacing: -.01em; font-weight: 620; }
  .lede { color: var(--ink-dim); font-size: .9375rem; max-width: 76ch; }

  .strip {
    display: flex; flex-wrap: wrap; gap: .3rem 1.6rem;
    margin: 1rem 0 1.4rem; padding: .6rem .9rem;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); font-size: .8125rem;
  }
  .strip div { color: var(--ink-dim); }
  .strip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .strip.down b, .strip.down div { color: var(--danger); }

  .form { display: grid; gap: 1.1rem; max-width: 60rem; }

  /* One radio per view, each with the standard name and what it ranks. */
  .views { display: grid; gap: .4rem; }
  .view {
    display: grid; grid-template-columns: 1.2rem minmax(0, 1fr); gap: .6rem;
    align-items: start; padding: .5rem .6rem; border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer;
  }
  .view:hover { background: var(--hover); }
  .view:has(input:checked) { border-color: var(--accent); background: var(--hover); }
  .view input { margin: .3rem 0 0; }
  .view b { font-weight: 600; font-size: .9375rem; }
  .view span { display: block; font-size: .8125rem; color: var(--ink-dim); line-height: 1.5; }

  .opts { display: grid; gap: .55rem; }
  .opt {
    display: grid; grid-template-columns: 9rem minmax(0, 1fr);
    gap: .6rem; align-items: center; font-size: .8125rem; color: var(--ink-dim);
  }
  .opt input[type=text] { font-family: ui-monospace, Menlo, monospace; max-width: 22rem; }
  .opt[hidden] { display: none; }
  .hint { font-size: .78125rem; color: var(--ink-faint); line-height: 1.5; }
  .hint.on { color: var(--accent); }

  .go { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* The address is shown because it is a shareable link, and because it makes
     clear the start page does nothing but assemble one. */
  .target {
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--ink-faint);
    background: var(--chip); border-radius: 6px; padding: .35rem .5rem; word-break: break-all;
  }
</style>
</head>
<body>
<nav class="appnav">
  <a href="/" aria-current="page">Start</a><span class="sep">|</span>
  <a href="/logprobs.html">Single string</a>
  <a href="/dijkstra.html">Lists</a><span class="sep">|</span>
  <a href="/help.html">Help</a>
  <span class="right" id="navStore">…</span>
</nav>

<div class="wrap">
  <header>
    <h1>Logprobs</h1>
    <div class="lede">
      One database of <code>gpt-3.5-turbo-instruct</code> calls, several views over it.
      Pick what to rank and how many results you want —
      <b>ask for 1 and you get that string token by token</b> instead of a list.
      <a href="/help.html">What do these options mean?</a>
    </div>
  </header>

  <div class="strip" id="strip"><div>loading store status…</div></div>

  <div class="panel form">
    <div class="views" role="radiogroup" aria-label="View">
      <label class="view">
        <input type="radio" name="view" value="completions" checked>
        <div><b>Completions</b>
          <span>One entry per recorded call: the whole string it produced, prompt included.
            Ranked by cumulative logprob (Σ logprob), descending.</span></div>
      </label>
      <label class="view">
        <input type="radio" name="view" value="prefixes">
        <div><b>Prefixes — best-first</b>
          <span>Every prefix in the token trie in exact n-best order. Every logprob is ≤ 0,
            so extending a prefix can only lower its sum; that makes the ordering provably
            correct (uniform-cost / Dijkstra search).</span></div>
      </label>
      <label class="view">
        <input type="radio" name="view" value="sweep">
        <div><b>Alternatives grid</b>
          <span>Per-position top-k for one base completion: at each position, the token the
            model actually chose plus the 19 it ranked behind it.</span></div>
      </label>
      <label class="view">
        <input type="radio" name="view" value="walk">
        <div><b>Cheapest-deviation walk</b>
          <span>Greedy hill-climbing over single-token edits: at each step take the deviation
            that costs the fewest nats of logprob, then regenerate the continuation.</span></div>
      </label>
    </div>

    <div class="opts">
      <label class="opt" id="wTop"><span>results</span>
        <select id="lTop">
          <option value="1">1 — open it token by token</option>
          <option>20</option><option>50</option><option>100</option>
          <option value="200" selected>200</option><option>500</option>
          <option>1000</option><option>2000</option>
        </select>
      </label>
      <div class="opt" id="wTopHint"><span></span><span class="hint" id="topHint"></span></div>
      <label class="opt" id="wPrefix"><span>starts with</span>
        <input type="text" id="lPrefix" placeholder="e.g. I have" spellcheck="false">
      </label>
      <label class="opt" id="wBase" hidden><span>base completion</span>
        <select id="lBase"></select>
      </label>
      <label class="opt" id="wSteps" hidden><span>steps</span>
        <input type="number" id="lSteps" value="20" min="1" max="200" style="width:5rem">
      </label>
      <label class="opt" id="wFwd" hidden><span>positions</span>
        <span><input type="checkbox" id="lFwd"> forward only — never undo an earlier deviation</span>
      </label>
      <label class="opt" id="wModel"><span>model</span>
        <select id="lModel">
          <option value="gpt-3.5-turbo-instruct">gpt-3.5-turbo-instruct</option>
          <option value="davinci-002">davinci-002</option>
          <option value="babbage-002">babbage-002</option>
        </select>
      </label>
    </div>

    <div class="go">
      <button class="primary" id="go">Open</button>
      <span class="target" id="target"></span>
    </div>
  </div>
</div>

<script>
const el = id => document.getElementById(id);
const viewOf = () => document.querySelector('input[name=view]:checked').value;
const RANKED = v => v === 'prefixes' || v === 'completions';
const single = () => RANKED(viewOf()) && el('lTop').value === '1';

/* --- store status --------------------------------------------------------- */
fetch('/api/stats', { cache: 'no-store' })
  .then(r => r.json())
  .then(s => {
    el('navStore').textContent = s.records + ' records';
    const models = Object.entries(s.models || {})
      .map(([m, n]) => `${m.split(':')[0]} ${n}`).join(' · ');
    el('strip').innerHTML = `
      <div>records: <b>${s.records}</b></div>
      <div>distinct prompts: <b>${s.distinct_prompts}</b></div>
      <div>sweep calls: <b>${s.sweep_calls}</b></div>
      <div>tokens in/out: <b>${s.prompt_tokens} / ${s.completion_tokens}</b></div>
      <div>models: <b>${models}</b></div>`;
  })
  .catch(() => {
    el('navStore').textContent = 'store not answering';
    el('strip').classList.add('down');
    el('strip').innerHTML = '<div>The store is not answering — start it with <b>py server.py</b>. '
      + 'Without it the lists cannot load, and the token browser is limited to what this '
      + 'browser already holds.</div>';
  });

/* --- base list, straight from the store ----------------------------------- */
let basesLoaded = false;
async function ensureBases() {
  if (basesLoaded) return;
  try {
    const { bases } = await (await fetch('/api/bases', { cache: 'no-store' })).json();
    el('lBase').innerHTML = bases.map(b => {
      const label = (b.text || b.base_id).replace(/\n/g, '⏎').slice(0, 46);
      return `<option value="${b.base_id}">${b.calls}× — ${label
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')}</option>`;
    }).join('');
    basesLoaded = true;
  } catch { el('lBase').innerHTML = '<option value="">(could not load)</option>'; }
}

/* Options that mean nothing for the chosen view are hidden, so they cannot end
   up in the address doing nothing. */
async function sync() {
  const view = viewOf();
  const ranked = RANKED(view);
  el('wTop').hidden = !ranked;
  el('wTopHint').hidden = !ranked;
  el('wPrefix').hidden = !ranked;
  el('wBase').hidden = ranked;
  el('wSteps').hidden = view !== 'walk';
  el('wFwd').hidden = view !== 'walk';
  el('wModel').hidden = !single();

  el('topHint').textContent = single()
    ? 'One result is a single string, so it opens in the token browser: every token with its '
      + 'top-20 alternatives, and a click follows one of them.'
    : 'A list, one string per row. Click a row to see its per-token detail.';
  el('topHint').classList.toggle('on', single());

  if (!ranked) await ensureBases();
  el('target').textContent = single() ? '/logprobs.html' : listUrl();
}

function listUrl() {
  const view = viewOf();
  const p = new URLSearchParams({ view });
  if (RANKED(view)) {
    if (el('lPrefix').value) p.set('prefix', el('lPrefix').value);
  } else {
    if (el('lBase').value) p.set('base_id', el('lBase').value);
    if (view === 'walk') {
      if (el('lFwd').checked) p.set('forward_only', '1');
      if (el('lSteps').value !== '20') p.set('steps', el('lSteps').value);
    }
  }
  return '/dijkstra.html?' + p.toString();
}

/* results and starts-with live in dijkstra.html's own localStorage, so they are
   handed over there rather than in the URL — otherwise the choice made here and
   the one made in the viewer would keep overriding each other. */
function handOverPreferences() {
  try {
    localStorage.setItem('dijkstra_limit', el('lTop').value);
    if (el('lPrefix').value) localStorage.setItem('dijkstra_prefix', el('lPrefix').value);
    else localStorage.removeItem('dijkstra_prefix');
  } catch {}
}

/* results = 1 means "this one string", so the top-ranked entry is resolved here
   and opened by id. Prefix entries are trie paths, not calls, so they have no
   record to open -- there the token browser starts at the root, which is the
   same thing one level up. */
async function openSingle() {
  const p = new URLSearchParams({ view: viewOf(), top: '1' });
  if (el('lPrefix').value) p.set('prefix', el('lPrefix').value);
  let id = null;
  try {
    const db = await (await fetch('/api/query?' + p, { cache: 'no-store' })).json();
    id = (db.entries || [])[0]?.id || null;
  } catch { /* store down: open the browser on whatever it has locally */ }
  const q = new URLSearchParams({ model: el('lModel').value });
  if (id) q.set('id', id);
  location.href = '/logprobs.html?' + q.toString();
}

for (const node of document.querySelectorAll('input[name=view]')) {
  node.addEventListener('change', sync);
}
for (const id of ['lTop', 'lBase', 'lSteps', 'lFwd', 'lModel']) {
  el(id).addEventListener('change', sync);
}
el('lPrefix').addEventListener('input', sync);

el('go').addEventListener('click', async () => {
  if (single()) return openSingle();
  handOverPreferences();
  location.href = listUrl();
});

sync();
</script>
</body>
</html>
